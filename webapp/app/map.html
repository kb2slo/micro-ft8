<!doctype html>
<meta name=viewport content='width=device-width,initial-scale=1,viewport-fit=cover'>
<title>Micro-FT8 Map</title>
<!--
  Full-screen map tool (docs/architecture/webapp.md (The map), 2026-09-22): split out of
  the Log tab's former List/Map toggle into its own page, reached from
  Tools. The Log tab only ever had room for one data layer (QSOs); this page
  fills the whole viewport and adds independent show/hide layers (QSOs,
  Decodes, POTA/SOTA spots, PSKReporter) over the same vector
  basemap. Not a rewrite of the renderer itself: projection, pan/zoom,
  basemap/border/grid/terminator drawing are the same math this app already
  proved out in the Log tab, just no longer coupled to one fixed dataset.

  Shares localStorage state with app.html (same origin): theme, distance
  unit, and the opportunistic callsign->grid cache -- so a choice made in
  Settings or a grid learned from a decode shows up here without this page
  re-deriving any of it. Also PSKReporter's stored spots (pskr_live.js), which
  this page adds to while its layer is on.
-->
<style>
:root{
  color-scheme:light dark;
  --accent:#1d4ed8;
  --accent-border:#93c5fd;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]){
    --accent:#7aa2f7;
    --accent-border:#3b5998;
  }
}
:root[data-theme="light"]{ color-scheme:light; }
:root[data-theme="dark"]{
  color-scheme:dark;
  --accent:#7aa2f7;
  --accent-border:#3b5998;
}
html,body{height:100%;margin:0;overflow:hidden}
/* Matches app.html's own global rule -- without it, any element here that
   also declares its own `display` (an ID selector always will, for layout)
   wins over the UA stylesheet's default [hidden]{display:none} purely on
   origin precedence, so setting .hidden=true stops actually hiding it.
   Found live 2026-09-22 via #callInfoModal (callinfo.js's own
   display:flex) staying visible despite hidden=true; !important here
   forecloses the whole bug class rather than patching one selector at a
   time. */
[hidden]{display:none!important}
body{font-family:system-ui;background:Canvas;color:CanvasText}

/* flex-wrap, not overflow-x:auto -- a horizontally-scrolling toolbar hides
   controls off-screen with no visual hint they exist; wrapping to a second
   row keeps every control visible and reachable regardless of window width,
   at the cost of the toolbar's own height varying (fine: it's a floating
   overlay over the full-viewport canvas below, not part of document flow
   the canvas has to make room for -- see #mapCanvasWrap's own comment). */
#mapToolbar{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;padding:.5rem .6rem;padding-top:calc(.5rem + env(safe-area-inset-top));background:Canvas;border-bottom:1px solid color-mix(in srgb, GrayText 30%, transparent)}
#mapBack{flex:none;border:0;background:transparent;color:var(--accent);font-size:.9rem;padding:.3rem .3rem .3rem 0;white-space:nowrap}
.layerbtn{flex:none;padding:.35rem .7rem;font-size:.78rem;border:1px solid GrayText;border-radius:999px;background:transparent;color:GrayText;white-space:nowrap}
.layerbtn.on{background:var(--accent);border-color:var(--accent);color:Canvas;font-weight:700}
.layerbtn:disabled{opacity:.4}
#mapTimeWrap{flex:none;display:flex;align-items:center;gap:.3rem;font-size:.75rem;color:GrayText;white-space:nowrap;margin-left:.2rem;padding-left:.5rem;border-left:1px solid color-mix(in srgb, GrayText 30%, transparent)}
#mapTimeSelect{font-size:.78rem;padding:.25rem .35rem;border:1px solid GrayText;border-radius:.4rem;background:Field;color:FieldText}
/* Full-viewport regardless of the toolbar's own (now variable) height --
   the toolbar floats on top (z-index:5) rather than sharing document flow
   with the canvas, so a wrapped second row just covers a little more of the
   map underneath it instead of requiring the canvas to resize around it. */
#mapCanvasWrap{position:fixed;inset:0;top:0}
#mapCanvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#mapNote{position:fixed;left:0;right:0;bottom:0;padding:.4rem 0 calc(.4rem + env(safe-area-inset-bottom));text-align:center;font-size:.75rem;color:GrayText;background:color-mix(in srgb, Canvas 75%, transparent);pointer-events:none}
/* Floating action, not a toolbar pill -- operator-requested 2026-09-23:
   this is a one-shot action (find me), not a toggleable layer, so it
   doesn't belong in the same visual language as QSOs/Decodes/POTA/SOTA/
   Places/Grid squares. Same icon-button language as app.html's own
   #navSettings (22px stroke icon, currentColor) for visual consistency
   across the two pages, even though this control only exists here. */
#mapLocateBtn{position:fixed;right:1rem;bottom:calc(3.2rem + env(safe-area-inset-bottom));z-index:7;width:2.75rem;height:2.75rem;border-radius:50%;border:1px solid color-mix(in srgb, GrayText 35%, transparent);background:Canvas;color:CanvasText;box-shadow:0 2px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;padding:0}
#mapLocateBtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---- tap-info popup: a lighter sheet than app.html's callInfoModal, since
   this page has none of that modal's session decode/QSO-history context to
   show -- just what the map itself knows about the tapped point. ---- */
#mapPopup{position:fixed;left:.6rem;right:.6rem;bottom:calc(.6rem + env(safe-area-inset-bottom));z-index:6;background:Canvas;color:CanvasText;border:1px solid color-mix(in srgb, GrayText 35%, transparent);border-radius:.6rem;padding:.7rem .8rem;box-shadow:0 2px 12px rgba(0,0,0,.25)}
#mapPopup[hidden]{display:none}
#mapPopupHead{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
#mapPopupCall{font-size:1.05rem;font-weight:700}
#mapPopupClose{border:0;background:transparent;color:GrayText;font-size:1rem;padding:.1rem .3rem}
#mapPopupBody{margin-top:.3rem;font-size:.82rem;color:GrayText}
#mapPopupBody div{margin-top:.15rem}
#mapPopupQrz{display:inline-block;margin-top:.4rem;color:var(--accent);font-size:.82rem}
</style>

<div id=mapToolbar>
  <a id=mapBack href=app.html>&larr; Tools</a>
  <button id=layerQsos class="layerbtn" type=button>QSOs</button>
  <button id=layerDecodes class="layerbtn" type=button>Decodes</button>
  <button id=layerPota class="layerbtn" type=button>POTA</button>
  <button id=layerSota class="layerbtn" type=button>SOTA</button>
  <button id=layerPlaces class="layerbtn" type=button>Places</button>
  <button id=layerGrid class="layerbtn" type=button>Grid squares</button>
  <button id=layerPsk class="layerbtn" type=button>PSKReporter</button>
  <label id=mapTimeWrap>Over the last
    <select id=mapTimeSelect>
      <option value="900000">15 minutes</option>
      <option value="1800000">30 minutes</option>
      <option value="3600000">1 hour</option>
      <option value="21600000">6 hours</option>
      <option value="86400000">24 hours</option>
      <option value="604800000">7 days</option>
      <option value="2592000000">30 days</option>
      <option value="">All time</option>
    </select>
  </label>
</div>
<div id=mapCanvasWrap>
  <canvas id=mapCanvas></canvas>
</div>
<button id=mapLocateBtn type=button aria-label="Zoom to my location">
  <svg viewBox="0 0 24 24"><circle cx=12 cy=12 r=3></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
</button>
<div id=mapNote></div>

<div id=mapPopup hidden>
  <div id=mapPopupHead>
    <span id=mapPopupCall></span>
    <button id=mapPopupClose type=button aria-label=Close>&times;</button>
  </div>
  <div id=mapPopupBody></div>
  <a id=mapPopupQrz target=_blank rel=noopener>QRZ lookup &rarr;</a>
</div>

<script src=/pairing.js></script>
<script src=callinfo.js></script>
<script src=pskr_core.js></script>
<script src=pskr_live.js></script>
<script src=geo_handoff.js></script>
<script>
'use strict';

// ---- shared helpers (mirrors app.html field-for-field -- see that file's
// own comments for why each formula/parse is the way it is; not repeated
// here to avoid the two drifting out of sync in the comments alone). ----
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function toRad(d) { return d * Math.PI / 180; }
function gridToLatLon(grid) {
  if (!grid || grid.length < 4) return null;
  var g = grid.toUpperCase();
  var A = 'A'.charCodeAt(0), Z0 = '0'.charCodeAt(0);
  var fl = g.charCodeAt(0) - A, fu = g.charCodeAt(1) - A;
  var sl = g.charCodeAt(2) - Z0, su = g.charCodeAt(3) - Z0;
  if (fl < 0 || fl > 17 || fu < 0 || fu > 17 || sl < 0 || sl > 9 || su < 0 || su > 9) return null;
  var lon = fl * 20 - 180 + sl * 2;
  var lat = fu * 10 - 90 + su * 1;
  if (g.length >= 6) {
    var tl = g.charCodeAt(4) - A, tu = g.charCodeAt(5) - A;
    if (tl >= 0 && tl <= 23 && tu >= 0 && tu <= 23) {
      lon += tl * (2 / 24) + (2 / 24) / 2;
      lat += tu * (1 / 24) + (1 / 24) / 2;
      return { lat: lat, lon: lon };
    }
  }
  lon += 1;
  lat += 0.5;
  return { lat: lat, lon: lon };
}
// Same field/square/subsquare parsing as gridToLatLon() above, but returns
// the square's real extent rather than collapsing it to a point -- needed
// by the grid deep link below to fit the view to the square's actual size
// (a 4-char square is ~15x the area of a 6-char one, so "zoomed into the
// grid square" means a very different zoom for each).
function gridToBBox(grid) {
  if (!grid || grid.length < 4) return null;
  var g = grid.toUpperCase();
  var A = 'A'.charCodeAt(0), Z0 = '0'.charCodeAt(0);
  var fl = g.charCodeAt(0) - A, fu = g.charCodeAt(1) - A;
  var sl = g.charCodeAt(2) - Z0, su = g.charCodeAt(3) - Z0;
  if (fl < 0 || fl > 17 || fu < 0 || fu > 17 || sl < 0 || sl > 9 || su < 0 || su > 9) return null;
  var lonMin = fl * 20 - 180 + sl * 2, latMin = fu * 10 - 90 + su * 1;
  var lonSpan = 2, latSpan = 1;
  if (g.length >= 6) {
    var tl = g.charCodeAt(4) - A, tu = g.charCodeAt(5) - A;
    if (tl >= 0 && tl <= 23 && tu >= 0 && tu <= 23) {
      lonMin += tl * (2 / 24);
      latMin += tu * (1 / 24);
      lonSpan = 2 / 24;
      latSpan = 1 / 24;
    }
  }
  return { lonMin: lonMin, lonMax: lonMin + lonSpan, latMin: latMin, latMax: latMin + latSpan };
}
// Inverse of gridToLatLon() -- a real lat/lon (from GPS, operator-requested
// 2026-09-23) to a full 6-character Maidenhead locator, same field/square/
// subsquare partition that function already decodes. 6, not 4: GPS is far
// more precise than even a 6-character square (~9 km) needs, so there's no
// reason to throw away resolution the way gridSquareLabel() deliberately
// does for its own purpose (labeling the *overlay's* 2x1 degree squares,
// unrelated to this). Lowercase subsquare letters, the same convention
// every grid string already flowing through this app uses (POTA's own
// "FN54vh", "DM69wi", ...).
function latLonToGrid(lat, lon) {
  var lonShift = ((lon + 180) % 360 + 360) % 360;
  var latShift = lat + 90;
  var fieldLon = Math.floor(lonShift / 20), fieldLat = Math.floor(latShift / 10);
  var sqLon = Math.floor((lonShift - fieldLon * 20) / 2), sqLat = Math.floor((latShift - fieldLat * 10) / 1);
  var subLon = Math.floor((lonShift - fieldLon * 20 - sqLon * 2) / (2 / 24));
  var subLat = Math.floor((latShift - fieldLat * 10 - sqLat * 1) / (1 / 24));
  return String.fromCharCode(65 + fieldLon) + String.fromCharCode(65 + fieldLat) +
    String(sqLon) + String(sqLat) +
    String.fromCharCode(97 + subLon) + String.fromCharCode(97 + subLat);
}
function greatCircle(a, b) {
  var R = 6371;
  var dLat = toRad(b.lat - a.lat), dLon = toRad(b.lon - a.lon);
  var la1 = toRad(a.lat), la2 = toRad(b.lat);
  var h = Math.sin(dLat / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dLon / 2) ** 2;
  var km = R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
  var y = Math.sin(dLon) * Math.cos(la2);
  var x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(dLon);
  var bearing = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  return { km: km, bearing: bearing };
}
var DIST_UNIT_KEY = 'microft8_dist_unit_v1';
var distUnit = 'km';
function loadDistUnit() {
  try {
    var v = localStorage.getItem(DIST_UNIT_KEY);
    if (v === 'km' || v === 'mi') distUnit = v;
  } catch (e) { /* default stands */ }
}
function fmtKm(km) {
  var value = distUnit === 'mi' ? km * 0.621371 : km;
  return Math.round(value).toLocaleString() + ' ' + distUnit;
}
function fmtKmBearing(km, bearingDeg) {
  var bearing = String(Math.round(bearingDeg)).padStart(3, '0') + '°';
  return fmtKm(km) + ' ' + bearing;
}
function fmtDuration(totalSeconds) {
  var s = Math.max(0, Math.floor(totalSeconds));
  var d = Math.floor(s / 86400); s -= d * 86400;
  var h = Math.floor(s / 3600); s -= h * 3600;
  var m = Math.floor(s / 60); s -= m * 60;
  if (d > 0) return d + 'd ' + h + 'h';
  if (h > 0) return h + 'h ' + m + 'm';
  if (m > 0) return totalSeconds > 300 ? m + 'm' : m + 'm ' + s + 's';
  return s + 's';
}
function fmtAgo(ts) {
  if (!ts) return '';
  var secs = (Date.now() - ts) / 1000;
  return secs < 1 ? 'just now' : fmtDuration(secs) + ' ago';
}
function parseUtcIso(s) {
  if (!s) return NaN;
  return Date.parse(/Z$/.test(s) ? s : s + 'Z');
}
// file is a day filename ("20260922.ADI"), timeStr is ADIF's "HH:MM" as
// /api/log/entries already returns it -- same derivation as app.html's own
// qsoEpochMs() (used there for the Log list's "ago" badge), needed here so
// the QSOs layer can be filtered by the "over the last..." control below.
function qsoEpochMs(file, timeStr) {
  var m = /^(\d{2}):(\d{2})$/.exec(timeStr || '');
  if (!m) return null;
  var y = parseInt(file.slice(0, 4), 10), mo = parseInt(file.slice(4, 6), 10), d = parseInt(file.slice(6, 8), 10);
  return Date.UTC(y, mo - 1, d, parseInt(m[1], 10), parseInt(m[2], 10));
}

var THEME_KEY = 'microft8_theme_v1';
var themePref = 'system';
(function loadTheme() {
  try {
    var v = localStorage.getItem(THEME_KEY);
    if (v === 'light' || v === 'dark') themePref = v;
  } catch (e) { /* default stands */ }
  if (themePref !== 'system') document.documentElement.setAttribute('data-theme', themePref);
})();
loadDistUnit();

var CALLSIGN_GRID_CACHE_KEY = 'microft8_callsign_grids_v1';
function loadCallsignGridCache() {
  try {
    var raw = localStorage.getItem(CALLSIGN_GRID_CACHE_KEY);
    return raw ? (JSON.parse(raw) || {}) : {};
  } catch (e) { return {}; }
}
// Value shape is {grid, ts} (app.html's own learnCallsignGrid()) -- these
// read either that or a bare grid string, since an entry written before
// this page's "over the last..." filter existed has no ts at all yet.
function cacheGridOf(entry) {
  return entry ? (typeof entry === 'string' ? entry : (entry.grid || '')) : '';
}
function cacheTsOf(entry) {
  return (entry && typeof entry === 'object' && entry.ts) ? entry.ts : null;
}

// BANDS/parseActiveBands: only needed here to classify a spot's raw
// frequency against the operator's active_bands filter, same as Tools' own
// spot card did -- copied rather than shared since there's no module system
// on this page (plain <script>, same as app.html).
var BAND_EDGES_KHZ = [
  { name: '160m', lo: 1800, hi: 2000 },
  { name: '80m', lo: 3500, hi: 4000 },
  { name: '60m', lo: 5250, hi: 5450 },
  { name: '40m', lo: 7000, hi: 7300 },
  { name: '30m', lo: 10100, hi: 10150 },
  { name: '20m', lo: 14000, hi: 14350 },
  { name: '17m', lo: 18068, hi: 18168 },
  { name: '15m', lo: 21000, hi: 21450 },
  { name: '12m', lo: 24890, hi: 24990 },
  { name: '10m', lo: 28000, hi: 29700 },
  { name: '6m', lo: 50000, hi: 54000 },
  { name: '2m', lo: 144000, hi: 148000 }
];
function khzToBandName(khz) {
  for (var i = 0; i < BAND_EDGES_KHZ.length; i++) {
    var e = BAND_EDGES_KHZ[i];
    if (khz >= e.lo && khz <= e.hi) return e.name;
  }
  return '';
}
function parseActiveBands(text) {
  var want = {};
  var any = false;
  String(text || '').split(/[\s,;\/]+/).forEach(function (t) {
    var n = parseInt(t, 10);
    if (n > 0) { want[n] = true; any = true; }
  });
  return { want: want, any: any };
}
var BAND_NUM_BY_NAME = { '160m':160,'80m':80,'60m':60,'40m':40,'30m':30,'20m':20,'17m':17,'15m':15,'12m':12,'10m':10,'6m':6,'2m':2 };
function activeBandFilter() {
  var parsed = parseActiveBands(lastCfg.active_bands);
  return function (bandName) { return !parsed.any || !!parsed.want[BAND_NUM_BY_NAME[bandName]]; };
}

var lastCfg = {};
async function loadCfg() {
  try {
    var r = await fetch('/api/config', { cache: 'no-store' });
    if (!r.ok) return;
    var cfg = await r.json();
    if (cfg.ok === false) return;
    lastCfg = cfg;
  } catch (e) { /* own-grid marker and spot band-filter just stay unavailable */ }
}

// ===================== basemap (unchanged from the Log tab's own map --
// see app.html's git history for this code's original comments) =====================
var LOG_MAP_LAND_URL = 'ne_110m_land.json';
var LOG_MAP_COUNTRIES_URL = 'ne_110m_countries.json';
var LOG_MAP_US_STATES_URL = 'ne_110m_us_states.json';
// World's 24 largest lakes (Natural Earth ne_110m_lakes, same source/tier
// as the other three), including all 5 Great Lakes -- found missing
// 2026-09-22: neither the land layer nor the US-states layer carves lakes
// out at all (checked directly: only 1 of 127 land polygons has a hole,
// and Michigan is a single un-split Polygon), so without this layer the
// Great Lakes render as solid "land" color, making the real state borders
// that correctly trace their shoreline (Michigan, Ohio, New York, ...)
// look like they're cutting across nothing rather than around a lake.
// Drawn last, on top of land and every border, filled the same color as
// ocean -- a lake is exactly the same "not land" as the ocean is, just
// landlocked. Bundled like the rest of the basemap: geometry only, no
// properties (matching land.json's own "nothing but the shape" stripping;
// this data isn't used for anything but visual fill) -- 8,489 B for all 24.
var LOG_MAP_LAKES_URL = 'ne_110m_lakes.json';
// World's ~243 largest cities/capitals (Natural Earth ne_110m_populated_places,
// same public-domain source and 110m tier as the other three bundle files),
// stripped to name/rank/coordinates -- raw file is 654,324 B carrying ~130
// columns per city (population back to 1950, Wikidata IDs, name in a dozen
// languages...); stripped, this is 28,524 B. Bundled rather than fetched at
// runtime (operator-decided 2026-09-22) -- cheap enough that there was no
// real reason to make it depend on connectivity.
var LOG_MAP_PLACES_URL = 'ne_110m_places.json';
// Finer tier (7,342 places worldwide, ne_10m_populated_places, same stripping
// -- 867,595 B) fetched lazily, once, only once the operator has actually
// zoomed in far enough to want more than the bundled 243 -- never bundled,
// this is exactly the "more detail at runtime, if connected" case discussed
// 2026-09-22. Not same-origin: `map.html` runs from the sidekick's own
// non-secure `http://micro-ft8.local` (docs/architecture/webapp.md (A non-secure origin)), so this has to come
// from somewhere that IS reachable, not from the bundle -- served from
// `micro-ft8.kalikstein.com` (the Cloudflare Worker `webapp/worker.js`
// already deploys) rather than the vendor's raw GitHub content, so it comes
// with our own CORS header (`Access-Control-Allow-Origin: *`, set
// unconditionally for every asset the Worker serves) and Cloudflare's own
// far-future asset caching, instead of depending on a third party's.
var LOG_MAP_PLACES_FINE_URL = 'https://micro-ft8.kalikstein.com/data/ne_10m_places.json';
var LOG_MAP_PLACES_FINE_ZOOM_MIN = 6; // comfortably before the bundled tier's own rank range (0-8) is exhausted at zoom 9, so the handoff feels smooth rather than a visible gap
var logMapGeo = null, logMapCountriesGeo = null, logMapUsStatesGeo = null, logMapLakesGeo = null;
var logMapPlaces = [];         // [{name, rank, lat, lon}], flattened from the raw GeoJSON at load time
var logMapPlacesFine = null;   // same shape, only set once the finer tier has actually loaded
var logMapPlacesFineLoadState = 'idle'; // 'idle' | 'loading' | 'done' | 'error'
var logMapCountryLabels = [];  // [{name, lat, lon}], computed once when logMapCountriesGeo loads
var logMapCountryBBoxes = [];  // [{programPrefix, name, lonMin, lonMax, latMin, latMax}], same timing -- feeds the POI fetch trigger below
var logMapStateLabels = [];    // same, for logMapUsStatesGeo

var LOG_MAP_PALETTE = {
  light: { ocean: '#ffffff', land: '#ffffff', coast: '#000000', countryBorder: 'rgba(0,0,0,.55)', stateBorder: 'rgba(0,0,0,.3)', grid: 'rgba(0,0,0,.15)', gridLabel: 'rgba(0,0,0,.4)', path: 'rgba(0,0,0,.35)', own: '#ea580c', qso: '#1d4ed8', decode: '#7c3aed', spot: '#059669', psk: '#be185d', pskPath: 'rgba(190,24,93,.35)', place: 'rgba(0,0,0,.55)', terminator: '#ca8a04' },
  dark: { ocean: '#000000', land: '#000000', coast: '#ffffff', countryBorder: 'rgba(255,255,255,.55)', stateBorder: 'rgba(255,255,255,.3)', grid: 'rgba(255,255,255,.15)', gridLabel: 'rgba(255,255,255,.4)', path: 'rgba(255,255,255,.35)', own: '#fb923c', qso: '#7aa2f7', decode: '#c4b5fd', spot: '#34d399', psk: '#f472b6', pskPath: 'rgba(244,114,182,.4)', place: 'rgba(255,255,255,.55)', terminator: '#fbbf24' }
};
function logMapDarkMode() {
  if (themePref === 'dark') return true;
  if (themePref === 'light') return false;
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function logMapPalette() {
  return logMapDarkMode() ? LOG_MAP_PALETTE.dark : LOG_MAP_PALETTE.light;
}
if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { renderLogMap(); });
}

async function fetchLogMapLayer(url) {
  try {
    var r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } catch (e) { return null; }
}
// Shoelace formula (signed area + centroid) over a single ring, treating
// lon/lat as flat x/y -- exactly what this map's equirectangular projection
// already does for everything else, so this is no more an approximation
// than the rest of the renderer, and plenty accurate for placing a text
// label (not used for anything geometric). Degenerate rings (near-zero

async function loadLogMapBasemap() {

  var results = await Promise.all([
    fetchLogMapLayer(LOG_MAP_LAND_URL),
    fetchLogMapLayer(LOG_MAP_COUNTRIES_URL),
    fetchLogMapLayer(LOG_MAP_US_STATES_URL),
    fetchLogMapLayer(LOG_MAP_PLACES_URL),
    fetchLogMapLayer(LOG_MAP_LAKES_URL)

  logMapUsStatesGeo = results[2];

// ===================== data layers (new: independent of the basemap
// above, one fetch/build function per toolbar toggle) =====================

// ---- QSOs: same ADIF-relay walk as app.html's downloadAllAdif(), just
// building map points instead of an ADIF blob. Independent of the Log tab's
// own lazy pagination -- this page has no Log list to stay in sync with. ----
var qsoLocations = [];      // [{call, grid, myGrid, ts}], deduped by grid at render

  var rows = [];

    var r = await fetch('/api/log/entries?file=' + encodeURIComponent(file) +
                        '&skip=' + skip + '&take=50', { cache: 'no-store' });
    var j = await r.json();
    if (!j.ok) throw new Error(j.why || 'entries failed');

    skip += page.length;

}
async function loadQsoLocations() {
  if (qsoLoadState === 'loading' || qsoLoadState === 'done') return;
  qsoLoadState = 'loading';

    var files = [];
    var skip = 0;
    while (true) {
      var r = await fetch('/api/log/files?skip=' + skip + '&take=30', { cache: 'no-store' });
      var j = await r.json();
      if (!j.ok) throw new Error(j.why || 'file list failed');

      skip += page.length;

          locs.push({ call: q.call, grid: qGrid, myGrid: qMyGrid, ts: ts });
        }

        // least as trustworthy as a bare decode, and a map-only session
        // (never opening the QSOs tab in app.html) would otherwise never
        // learn it -- this is app.html's own appendLogRows() fix, mirrored

        CallInfo.learnGrid(q.call, q.grid);

// ---- Decodes: the same opportunistic callsign->grid cache Operate builds

// ---- POTA/SOTA spots: same sourcing/filtering Tools' own spot card used
// (docs/architecture/webapp.md (Tools): online-required; SOTA's api-db2 endpoint, found live while

var SOTA_SPOTS_URL = 'https://api-db2.sota.org.uk/api/spots/50/all/all';

  spotLoadState = 'loading';

  try {
    var pr = await fetch(POTA_ACTIVATOR_URL, { cache: 'no-store' });
    var pj = await pr.json();

      var khz = parseFloat(s.frequency);

async function fetchPotaProgram(prefix) {
  if (poiPotaPrograms[prefix]) return;
  poiPotaPrograms[prefix] = 'loading';
  try {
    var r = await fetch('https://api.pota.app/program/parks/' + encodeURIComponent(prefix), { cache: 'no-store' });

    poiPotaPrograms[prefix] = 'done';
  } catch (e) {
    poiPotaPrograms[prefix] = 'error'; // that one country's parks just don't show -- every other program keeps working
  }
  renderLogMap();
}

async function fetchSotaAssociations() {
  if (poiSotaAssocState !== 'idle') return;
  poiSotaAssocState = 'loading';

    var r = await fetch('https://api-db2.sota.org.uk/api/associations/', { cache: 'no-store' });

    poiSotaAssociations = await r.json();
    poiSotaAssocState = 'done';
  } catch (e) {
    poiSotaAssocState = 'error'; // no SOTA summits at all this session -- POTA parks are unaffected

  renderLogMap();
}

    var detail = await r.json();

  renderLogMap();

    var r = await fetch('https://api-db2.sota.org.uk/api/regions/' + encodeURIComponent(assoc) + '/' + encodeURIComponent(region), { cache: 'no-store' });

// Called every render (cheap: every check below is a no-op once a given

// tick and a debounce would just be a second timer duplicating that.

  if (logMapZoom < LOG_MAP_POI_ZOOM_MIN) return;
  var view = currentViewBBox(w, h);
  if (!view) return;

  // Each half gated by its own toggle now that POTA and SOTA are
  // independent layers (operator-requested 2026-09-22) -- an operator who
  // only wants SOTA shouldn't pay for POTA's per-country fetches (and vice
  // versa) just because they're both zoomed in far enough. And within a
  // program, this whole (heavy) static-location fetch only runs in 'all'
  // state -- 'spots' mode is deliberately lighter, live activity only, so
  // it must not trigger the same per-country/per-region walk 'all' does.
  if (layerState.pota === 'all') {
    // Which bundled countries overlap the view -> that country's own
    // program. The country's ISO code (CallInfo.countryCode(), which
    // replaces Natural Earth's '-99' and 'CN-TW' placeholders) doubles as
    // POTA's programPrefix for nearly all bundled countries (measured
    // 2026-09-22); a program that does not exist just 404s and silently
    // never loads, same as any other unreachable program.

      if (!c.programPrefix || poiPotaPrograms[c.programPrefix]) return;
      if (bboxesOverlap(c, view)) fetchPotaProgram(c.programPrefix);

  }
  if (layerState.sota !== 'all') return;

  // SOTA: associations list first (once, cheap -- every association's own
  // bbox, no summits yet), then overlapping associations' region lists
  // (each region's own bbox), then overlapping regions' actual summits.
  if (poiSotaAssocState === 'idle') { fetchSotaAssociations(); return; }
  if (poiSotaAssocState !== 'done') return;
  poiSotaAssociations.forEach(function (a) {
    var abox = { lonMin: a.minLong, lonMax: a.maxLong, latMin: a.minLat, latMax: a.maxLat };

    if (regions === 'loading' || !regions.forEach) return;
    regions.forEach(function (rgn) {
      var rbox = { lonMin: rgn.minLong, lonMax: rgn.maxLong, latMin: rgn.minLat, latMax: rgn.maxLat };
      if (!bboxesOverlap(rbox, view)) return;
      fetchSotaRegion(a.associationCode, rgn.regionCode);
    });
  });
}

// ===================== toolbar / layer state =====================

// "Over the last..." recency filter, shared across every layer rather than

// currently-active spot all shown at once. null means "All time" (no

loadMapTimeWindow();
var mapTimeSelectEl = document.getElementById('mapTimeSelect');

// Only QSOs is on when the map opens; every other layer starts off

refreshLayerBtns();

function updateMapNote() {
  var note = document.getElementById('mapNote');
  var parts = [];
  if (layerState.qsos) {
    if (qsoLoadState === 'done') {
      var n = uniqueGridCount(visibleQsoLocations());
      parts.push(n + ' QSO grid' + (n === 1 ? '' : 's'));
    } else if (qsoLoadState.indexOf('loading') === 0) parts.push('QSOs: ' + qsoLoadState.replace('loading:', 'loading '));
    else if (qsoLoadState === 'error') parts.push('QSOs unavailable');
  }
  if (layerState.pota !== 'off' || layerState.sota !== 'off') {
    if (spotLoadState === 'done') {
      var sn = visibleSpotLocations().length;
      parts.push(sn + ' spot' + (sn === 1 ? '' : 's'));
    } else if (spotLoadState === 'loading') parts.push('spots: loading…');
    else if (spotLoadState === 'error') parts.push('spots unavailable');
  }
  // POI cap readout -- reports how many of the in-viewport candidates
  // actually got drawn against poiMaxVisible, so "142 of 1,830 POIs" stays
  // legible feedback about the settled cap even with its tuning control
  // gone, not just a silently-truncated map.
  if (layerState.psk) {
    var pskStatus = PskrLive.status(), pskState = PskrLive.state();
    if (!pskState) parts.push('PSKReporter: no call set');
    else {
      var pn = visiblePskReceivers().length;
      var pskNote = { connecting: 'connecting', offline: 'offline', unreachable: 'unreachable', refused: 'refused' }[pskStatus];
      parts.push(pn + ' station' + (pn === 1 ? '' : 's') + ' heard ' + pskState.call + (pskNote ? ' (PSKReporter ' + pskNote + ')' : ''));
    }
  }
  if (lastPoiCapStats) {
    parts.push(lastPoiCapStats.shown + ' of ' + lastPoiCapStats.total + ' POI' + (lastPoiCapStats.total === 1 ? '' : 's'));
  }

// ===================== render =====================
function renderLogMap() {
  var canvas = document.getElementById('mapCanvas');
  if (!logMapGeo) return;
  var cssW = canvas.clientWidth, cssH = canvas.clientHeight;
  if (!cssW || !cssH) return;
  var dpr = window.devicePixelRatio || 1;
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  var ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  logMapBaseScale = computeLogMapBaseScale(cssW, cssH);
  if (!logMapCenterSet) {
    var own = lastCfg.grid ? gridToLatLon(lastCfg.grid) : null;
    logMapCenterLon = own ? own.lon : 0;
    logMapCenterLat = own ? own.lat : 0;
    logMapCenterSet = true;
  }
  clampLogMapView(cssW, cssH);
  var bands = computeVerticalBands((cssH / 2) / logMapScale());
  // Unconditional on layerState.places (operator-decided 2026-09-22) -- the
  // fetch happens purely off zoom, the same trigger every other zoom-gated
  // reveal on this map uses, regardless of whether Places is currently
  // toggled on; flipping it on later should already have the finer tier
  // warm rather than needing its own fetch at that point.
  if (logMapZoom >= LOG_MAP_PLACES_FINE_ZOOM_MIN && logMapPlacesFineLoadState === 'idle') loadLogMapPlacesFine();

  var pal = logMapPalette();
  drawLogMapBasemap(ctx, cssW, cssH, bands);
  drawLogMapBorders(ctx, cssW, cssH, logMapCountriesGeo, pal.countryBorder, bands);
  if (logMapZoom >= LOG_MAP_STATE_BORDER_ZOOM_MIN) {
    drawLogMapBorders(ctx, cssW, cssH, logMapUsStatesGeo, pal.stateBorder, bands);
  }
  drawLogMapLakes(ctx, cssW, cssH, bands);
  if (layerState.grid) {
    drawLogMapGridSquares(ctx, cssW, cssH);
    drawLogMapGridLabels(ctx, cssW, cssH);
  }
  drawLogMapTerminator(ctx, cssW, cssH, bands);
  if (layerState.places) drawLogMapPlaces(ctx, cssW, cssH, bands, pal);

  logMapPins = [];

  // QSOs: dedupe by grid (one pin/path per unique grid, not per QSO -- a
  // repeat contact with the same station shouldn't multiply the ink), path
  // drawn from the QSO's own my_grid since that can differ QSO to QSO
  // (portable/mobile operation) even though it's usually the operator's
  // current grid.
  var visibleQsos = layerState.qsos ? visibleQsoLocations() : [];
  if (visibleQsos.length) {
    var byGrid = {};
    visibleQsos.forEach(function (loc) {
      if (!byGrid[loc.grid]) byGrid[loc.grid] = { grid: loc.grid, myGrid: loc.myGrid, calls: {}, lastCall: loc.call };
      byGrid[loc.grid].calls[loc.call] = true;
      byGrid[loc.grid].lastCall = loc.call;
    });
    var uniqueGrids = Object.keys(byGrid).map(function (g) { return byGrid[g]; });

    ctx.strokeStyle = pal.path;
    ctx.lineWidth = 1;
    // The path and the pin below share the same resolved point (b computed
    // once here) so a QSO's line and its dot always end at the same place.
    uniqueGrids.forEach(function (g) {
      var a = gridToLatLon(g.myGrid), b = gridToLatLon(g.grid);
      if (!a || !b) return;
      g._pt = b;
      forEachBandOffset(bands, function (band, lonOffset) { drawGreatCirclePath(ctx, cssW, cssH, a, b, band, lonOffset); });
    });

    ctx.fillStyle = pal.qso;
    uniqueGrids.forEach(function (g) {
      var b = g._pt;
      if (!b) return;
      forEachBandOffset(bands, function (band, lonOffset) {
        var p = bandProject(band, b.lat, b.lon, lonOffset, cssW, cssH);
        if (p.x < -20 || p.x > cssW + 20 || p.y < -20 || p.y > cssH + 20) return;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();

      });
    });
  }

  // Decodes: pins only, no path -- "heard roughly here", not a worked
  // contact. Slightly smaller than a QSO pin so the two are visually
  // distinct even at a glance, not just by (also different) color.

  if (visibleDecodes.length) {
    ctx.fillStyle = pal.decode;

        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
        ctx.fill();

      });
    });
  }

  // PSKReporter: stations that reported hearing us (docs/architecture/webapp.md, Who hears me). One per receiver,
  // with a path from our own grid like a QSO's; a diamond, so it reads apart from a QSO's dot by shape too.
  var visiblePsk = layerState.psk ? visiblePskReceivers() : [];
  if (visiblePsk.length) {
    var ownPt = lastCfg.grid ? gridToLatLon(lastCfg.grid) : null;
    if (ownPt) {
      ctx.strokeStyle = pal.pskPath;
      ctx.lineWidth = 1;
      visiblePsk.forEach(function (r) {
        forEachBandOffset(bands, function (band, lonOffset) { drawGreatCirclePath(ctx, cssW, cssH, ownPt, r.pt, band, lonOffset); });
      });
    }
    ctx.fillStyle = pal.psk;
    visiblePsk.forEach(function (r) {
      forEachBandOffset(bands, function (band, lonOffset) {
        var p = bandProject(band, r.pt.lat, r.pt.lon, lonOffset, cssW, cssH);

        ctx.moveTo(p.x, p.y - 4); ctx.lineTo(p.x + 4, p.y + 3); ctx.lineTo(p.x - 4, p.y + 3);
        ctx.closePath();
        ctx.fill();
        var spotPin = { x: p.x, y: p.y, call: r.call, grid: r.grid, lat: pt.lat, lon: pt.lon,

        logMapPins.push(spotPin);

      });
    });
  }

  // Static POTA/SOTA locations: every known park/summit the viewport has
  // pulled in so far -- skipped for any ref that's currently an active spot
  // (already drawn as the filled triangle above), so a currently-active
  // park/summit never gets two markers at the same point.
  //
  // Real-density problem found live 2026-09-22: POTA's ~13,000 US parks and
  // SOTA's mountain-dense summit lists (New Mexico's alone rendered as a
  // solid green mass even at zoom 8) mean *no* zoom threshold on its own
  // keeps this legible. Three approaches tried and dropped the same day
  // before this one -- see git history on this comment for the full account
  // of each if it matters again: a fixed-size spatial-grid dot cap (one dot
  // per screen cell, silently dropping the rest); marker clustering on top
  // of it (count-labeled circles, adaptive cell size) -- operator: "I don't
  // like it"; then a plain visible-count cap sorted nearest-to-center --
  // operator: "your center clustering of the POIs to show is wrong ...
  // choose ones as even spread across the view as possible". **Settled on
  // an adaptive spatial grid again, but without clustering's circles/counts
  // and without the fixed 14px this page started from**: bucket the
  // viewport into cells and keep one representative POI per cell
  // (first-candidate-wins, same as the very first approach), but size the
  // cell so the resulting occupied-cell count lands at poiMaxVisible --
  // starting from an analytic guess (cell area = viewport area /
  // poiMaxVisible, so a uniform density lands close on the first try) and
  // growing from there (bounded) when real density is uneven enough that
  // the guess still overshoots in a dense sub-region. A grid is what makes
  // "even spread" the natural outcome, not a side effect to engineer for --
  // distance-from-center ranking (the previous round) always biases toward

    triggerPoiFetches(cssW, cssH);
    var activeRefs = {};
    visibleSpots.forEach(function (r) { activeRefs[r.ref] = true; });

    // totalSeen is identical across every cellPx tried below (it counts
    // every viewport-visible candidate once, before any dedup), so it only
    // needs computing on the first call and is reused for the "N of M"
    // readout rather than a second full scan.
    var poiTotalSeen = null;

          if (p.x < -10 || p.x > cssW + 10 || p.y < -10 || p.y > cssH + 10) return;

          cellCount++;
        });
      };
      if (layerState.pota === 'all') poiPotaParks.forEach(function (poi) { bucketPoi(poi, 'POTA'); });
      if (layerState.sota === 'all') poiSotaSummits.forEach(function (poi) { bucketPoi(poi, 'SOTA'); });

    };

    var poiCellPx = Math.max(8, Math.sqrt((cssW * cssH) / Math.max(1, poiMaxVisible)));
    var poiResult = bucketPoisAtCellPx(poiCellPx);
    var poiGrowSteps = 0;
    while (poiResult.cellCount > poiMaxVisible && poiGrowSteps < LOG_MAP_POI_GRID_MAX_GROWTH) {

      poiResult = bucketPoisAtCellPx(poiCellPx);

    ctx.strokeStyle = pal.spot;
    ctx.lineWidth = 1.5;
    Object.keys(poiResult.cells).forEach(function (key) {
      var cell = poiResult.cells[key];
      ctx.beginPath();
      ctx.arc(cell.x, cell.y, 2.5, 0, Math.PI * 2);
      ctx.stroke();
      var poiPin = { x: cell.x, y: cell.y, name: cell.poi.name, lat: cell.poi.lat, lon: cell.poi.lon,
                      source: cell.program, ref: cell.poi.ref, points: cell.poi.points };
      logMapPins.push(poiPin);
      if (cell.poi.name && cell.poi.ref) poiLabelCandidates.push({ text: cell.poi.name + ' (' + cell.poi.ref + ')', x: cell.x + 5, y: cell.y, pin: poiPin });
    });

  } else {
    lastPoiCapStats = null; // layer off or too zoomed out to fetch at all -- nothing for the readout to report
  }

  // POI labels, operator-requested 2026-09-22 ("if there is enough
  // whitespace ... show the POTA/SOTA name and ID"), gated separately from
  // the dots/triangles themselves at LOG_MAP_POI_LABEL_ZOOM_MIN (17) --
  // "don't show the POTA/SOTA names until at least zoom level 17",
  // operator-tightened the same day after LOG_MAP_MAX_ZOOM was raised
  // further. Below that, dots still draw (LOG_MAP_POI_ZOOM_MIN, much
  // lower) but carry no text -- tap-to-inspect still names one on demand.
  // Same greedy collision-avoidance placer Places uses
  // (labelBox()/boxesOverlap()): a candidate draws only if its padded box
  // clears every label already placed this pass, first-candidate-wins,
  // skipped (not hidden -- the marker itself always draws) rather than
  // truncated when there's no room. Its own placement pass, not merged with
  // drawLogMapPlaces()'s -- that function's `placed` list is local to its
  // own call and runs earlier, so threading it through here for the rare
  // Place/POI overlap isn't worth the coupling.
  //
  // The placed box is stashed on the candidate's own pin (c.pin.labelBox)
  // so handleLogMapTap() can hit-test the text too, not just the dot --
  // operator-requested 2026-09-22 ("is the text related to the poi also
  // clickable? If not, it should be"). Only ever set below when a label
  // actually draws this frame -- every pin is a fresh object built earlier
  // in this same render (logMapPins is reset at the top of renderLogMap()),
  // so a skipped-for-space label simply leaves labelBox undefined rather
  // than needing to be cleared from a stale previous render.
  if (logMapZoom >= LOG_MAP_POI_LABEL_ZOOM_MIN && poiLabelCandidates.length) {
    ctx.font = LOG_MAP_PLACE_FONT;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillStyle = pal.spot;
    var poiPlaced = [];
    poiLabelCandidates.forEach(function (c) {
      var width = ctx.measureText(c.text).width;
      var box = labelBox(c.x, c.y, width, false);
      for (var i = 0; i < poiPlaced.length; i++) {
        if (boxesOverlap(box, poiPlaced[i])) return;
      }
      poiPlaced.push(box);
      ctx.fillText(c.text, c.x, c.y);
      if (c.pin) c.pin.labelBox = box;
    });
  }

  var ownPt = lastCfg.grid ? gridToLatLon(lastCfg.grid) : null;
  if (ownPt) {
    forEachBandOffset(bands, function (band, lonOffset) {
      var p = bandProject(band, ownPt.lat, ownPt.lon, lonOffset, cssW, cssH);
      if (p.x < -20 || p.x > cssW + 20 || p.y < -20 || p.y > cssH + 20) return;
      ctx.fillStyle = pal.own;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  updateMapNote();
}
window.addEventListener('resize', function () { renderLogMap(); });
setInterval(function () { renderLogMap(); }, 60000); // terminator drift, same interval/reasoning as the original Log map

// ---- tap-to-inspect: a lighter popup than app.html's callInfoModal (no
// session decode history or full QSO log to show on this page) -- just what
// the tapped pin itself carries, plus distance/bearing from the operator's
// own grid when both ends are known. ----
// Every QSO regardless of grid validity (unlike qsoLocations, which only
// ever kept plottable ones) -- see qsoHistoryByCall's own comment.
function mapQsoHistoryFor(call) {
  return (qsoHistoryByCall[call] || []).map(function (q) {
    return { when: fmtAgo(q.ts), band: q.band, freq: q.freq, rstSent: q.rstSent, rstRcvd: q.rstRcvd };
  });
}
// Official reference page -- POTA/SOTA only, the two programs this map
// actually sources locations from. A SOTA summit code is itself two path
// segments ("W7O/CC-001" == association/summit) -- see callinfo.js's own
// officialLink() for why the "/" can't just be encodeURIComponent'd away
// with the rest of the string (found live 2026-09-22: %2F doesn't route).
function officialPoiLink(program, ref) {
  if (program === 'POTA') return 'https://pota.app/#/park/' + encodeURIComponent(ref);
  if (program === 'SOTA') return 'https://www.sotadata.org.uk/en/summit/' + ref.split('/').map(encodeURIComponent).join('/');
  return '';
}
function showMapPopup(pin) {
  // A real operator callsign (QSO/Decode/an active spot) gets the shared
  // card (operator-requested 2026-09-22: "a common experience any time we
  // select a callsign anywhere in the web app") -- this page's own lighter
  // #mapPopup is only for a static POTA/SOTA location, which has no
  // operator/callsign to show a callsign card *for* at all.
  if (pin.call) {
    // A receiver's own grid from its spot is a reliable pairing for the shared cache (callinfo.js, learnGrid()).
    if (pin.source === 'PSKReporter') CallInfo.learnGrid(pin.call, pin.grid);
    CallInfo.show(pin.call, { myGrid: lastCfg.grid, qsoHistory: mapQsoHistoryFor,
                              heardUs: function (c) { return PskrCore.heardBy(PskrLive.state(), c); } });
    return;
  }
  document.getElementById('mapPopupCall').textContent = pin.name || '(unknown)';
  var body = '<div>' + esc(pin.source) + (pin.ref ? ' · ' + esc(pin.ref) : '') +
    (pin.source === 'SOTA' && pin.points != null ? ' · ' + esc(pin.points) + ' pts' : '') + '</div>';
  var distBearing = '';
  if (lastCfg.grid && pin.lat != null && pin.lon != null) {
    var a = gridToLatLon(lastCfg.grid);
    if (a) { var gc = greatCircle(a, { lat: pin.lat, lon: pin.lon }); distBearing = fmtKmBearing(gc.km, gc.bearing); }
  }
  if (distBearing) body += '<div>' + esc(distBearing) + '</div>';
  var link = officialPoiLink(pin.source, pin.ref);
  if (link) body += '<a class=ci-link href="' + esc(link) + '" target=_blank rel=noopener>' +
    esc(pin.source === 'POTA' ? 'View park on POTA' : 'View summit on SOTA') + ' →</a>';
  document.getElementById('mapPopupBody').innerHTML = body;
  document.getElementById('mapPopupQrz').hidden = true; // no operator to look up for a static location
  document.getElementById('mapPopup').hidden = false;
}
document.getElementById('mapPopupClose').onclick = function () {
  document.getElementById('mapPopup').hidden = true;
};
// Tap hit-radius raised 14 -> 22px, operator-reported 2026-09-22 ("we lost
// the ability for the POIs to be clickable to their detail view"). Traced
// this specifically, not just assumed: showMapPopup()/the tap-to-pin match
// itself is unchanged and confirmed still correct with a precisely-aimed
// tap. The even-spread round just above this one is what actually moved --
// POIs used to be dense enough that a near-miss tap still landed within 14px
// of *something*; spread out (by that round's own design), an imprecise tap
// on an isolated dot now often lands on nothing. 22px doesn't change *which*
// pin wins a tap near two candidates (still nearest-within-range), only how
// forgiving "in range" is.
function handleLogMapTap(clientX, clientY) {
  if (logMapZoom < LOG_MAP_TAP_ZOOM_MIN) return;
  var rect = document.getElementById('mapCanvas').getBoundingClientRect();
  var x = clientX - rect.left, y = clientY - rect.top;
  var best = null, bestD = 22;
  logMapPins.forEach(function (p) {
    var d = Math.hypot(p.x - x, p.y - y);
    if (d < bestD) { bestD = d; best = p; }
  });
  // Fall back to a POI's drawn name/ref label, not just its dot -- operator-
  // requested 2026-09-22 ("is the text related to the poi also clickable?
  // If not, it should be"). A label can sit 5-6px past the dot radius plus
  // its own text width, well outside bestD above, so this is a genuinely
  // separate hit test (a rectangle, not a distance), tried only when the
  // dot search missed -- a dot tap should never be shadowed by a nearby
  // label's box.
  if (!best) {
    logMapPins.forEach(function (p) {
      var box = p.labelBox;
      if (box && x >= box.x0 && x <= box.x1 && y >= box.y0 && y <= box.y1) best = p;
    });
  }
  if (best) showMapPopup(best);
}

// ---- gesture handling: identical to the original Log-tab map (single-
// finger drag pans, two-finger pinch zooms anchored at the pinch midpoint,
// a tap under DRAG_CLAIM_PX inspects a pin) -- this page has no swipe-tab
// track to fight over touches with, so the stopPropagation() calls the
// original needed for that reason are no longer load-bearing, but are kept
// anyway since they're harmless and this is otherwise a verbatim port. ----
//
// Real bug found and fixed 2026-09-22, operator-reported from an actual
// iPhone ("tapping POTA POIs is definitely still not working ... is there a
// difference for a phone tap vs a mouse click?") -- yes, genuinely: touch
// and mouse are two separate handler sets below with their own state, and
// every tap verification up to this point (this session and earlier ones,
// per this row's own "not provable by an agent: real touchscreen" caveats)
// only ever exercised the mouse path, which never fires a single
// intermediate move event for a synthetic click -- so it could never have
// caught what was actually wrong with *movement tracking* on a real finger.
// dragMoved/mouseMoved used to *accumulate* `|dx|+|dy|` across every
// move tick -- that measures total path length, not how far the finger
// actually ended up from where it started. A real touchscreen reports
// several move events even for a finger that never leaves a ~3px spot
// (capacitive sensor noise), and summing that noise tick over tick can
// blow past DRAG_CLAIM_PX (10px) well before the finger has gone anywhere
// -- exactly the class of bug a synthetic mouse click (zero move events,
// so the old accumulator could never even engage) could never surface.
// Fixed by tracking a start point and measuring straight-line displacement
// from it at release time instead of summing per-tick deltas -- correct
// for "did this drag" regardless of how many noisy samples arrived along
// the way.
(function () {
  var canvas = document.getElementById('mapCanvas');
  var DRAG_CLAIM_PX = 10;
  var dragging = false, lastX = 0, lastY = 0, startX = 0, startY = 0;
  var pinchStartDist = 0, pinchStartZoom = 1;

  function touchDist(t1, t2) { return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY); }
  function netMoved(x, y) { return Math.hypot(x - startX, y - startY); }
  function panBy(dx, dy, w, h) {
    var s = logMapScale();
    logMapCenterLon -= dx / s;
    logMapCenterLat += dy / s;
    clampLogMapView(w, h);
  }

  canvas.addEventListener('touchstart', function (e) {
    e.stopPropagation();
    if (e.touches.length === 1) {
      dragging = true;
      startX = lastX = e.touches[0].clientX; startY = lastY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      dragging = false;
      pinchStartDist = touchDist(e.touches[0], e.touches[1]);
      pinchStartZoom = logMapZoom;
    }
  }, { passive: true });

  canvas.addEventListener('touchmove', function (e) {
    e.stopPropagation();
    e.preventDefault();
    var w = canvas.clientWidth, h = canvas.clientHeight;
    if (e.touches.length === 1 && dragging) {
      var dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      panBy(dx, dy, w, h);
      renderLogMap();
    } else if (e.touches.length === 2 && pinchStartDist > 0) {
      var d = touchDist(e.touches[0], e.touches[1]);
      var midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      var midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      logMapZoomAt(midX, midY, pinchStartZoom * (d / pinchStartDist));
      renderLogMap();
    }
  }, { passive: false });

  canvas.addEventListener('touchend', function (e) {
    e.stopPropagation();
    if (dragging && e.changedTouches.length === 1 &&
        netMoved(e.changedTouches[0].clientX, e.changedTouches[0].clientY) < DRAG_CLAIM_PX) {
      handleLogMapTap(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
    }
    dragging = false;
    pinchStartDist = 0;
  }, { passive: true });

  var mouseDown = false;
  canvas.addEventListener('mousedown', function (e) {
    mouseDown = true; startX = lastX = e.clientX; startY = lastY = e.clientY;
  });
  window.addEventListener('mousemove', function (e) {
    if (!mouseDown) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    panBy(dx, dy, canvas.clientWidth, canvas.clientHeight);
    renderLogMap();
  });
  window.addEventListener('mouseup', function (e) {
    if (mouseDown && netMoved(e.clientX, e.clientY) < DRAG_CLAIM_PX) handleLogMapTap(e.clientX, e.clientY);
    mouseDown = false;
  });
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    logMapZoomAt(e.clientX, e.clientY, logMapZoom * (e.deltaY < 0 ? 1.2 : 1 / 1.2));
    renderLogMap();
  }, { passive: false });
})();

// ===================== geolocation (operator-requested 2026-09-23) =====================
// geo_handoff.js leaves for geo.html only once the host answers; the return
// carries ?lat=&lon=, read below.
document.getElementById('mapLocateBtn').onclick = function () {
  MicroFT8Geo.handoff(location.origin + location.pathname, function (t) {
    document.getElementById('mapNote').textContent = t;
  }, 'No internet right now, so your location cannot be read.');
};

async function writeGridConfig(grid) {
  var note = document.getElementById('mapNote');
  note.textContent = 'Setting grid…';
  try {
    var r = await MicroFT8Pairing.authFetch('/api/config', {
      method: 'PUT', headers: { 'Content-Type': 'text/plain' }, body: 'grid=' + grid
    });
    if (r.status === 401) {
      MicroFT8Pairing.needsReauth();
      note.textContent = 'Press the sidekick button to pair';
      return;
    }
    var j = await r.json().catch(function () { return {}; });
    if (!r.ok || j.ok === false) {
      note.textContent = 'Setting grid failed: ' + (j.why || r.status);
      return;
    }
    lastCfg.grid = grid; // reflect immediately -- own marker, every distance/bearing reading
    note.textContent = 'Grid set to ' + grid + '.';
    renderLogMap();
  } catch (e) {
    note.textContent = 'Setting grid failed: ' + (e && e.message ? e.message : e);
  }
}
// boot()'s own pairing logic, not a bare getToken() check -- boot() already
// knows how to call straight through when a token exists and how to wait
// for a button press (with a visible status) when it doesn't, so reusing
// it here rather than half-reimplementing gets the "no token yet" path
// correct for free, same as every mutating call on app.html already gets.
function setGridFromGeo(grid) {
  MicroFT8Pairing.boot({
    status: document.getElementById('mapNote'),
    onPaired: function () { writeGridConfig(grid); }
  });
}

// Runs once, at boot, only when the URL actually carries a return from
// geo.html -- an ordinary page load never has these params at all. Cleans
// them from the URL immediately either way, so a later refresh of this
// same tab can't replay the prompt against a since-changed lastCfg.grid.
function handleGeoReturn() {
  var params = new URLSearchParams(location.search);
  var latStr = params.get('lat'), lonStr = params.get('lon');
  if (latStr == null || lonStr == null) return;
  history.replaceState(null, '', location.pathname);
  var lat = parseFloat(latStr), lon = parseFloat(lonStr);
  if (!isFinite(lat) || !isFinite(lon)) return;

  logMapCenterLon = lon;
  logMapCenterLat = lat;
  logMapCenterSet = true;
  logMapZoom = Math.max(logMapZoom, 12);
  renderLogMap();

  // Compared at whatever precision the operator's own configured grid
  // already has -- a 4-character lastCfg.grid shouldn't provoke an "update?"
  // prompt every time just because GPS is naturally more precise than 4
  // characters; only a real disagreement (or nothing configured at all)
  // should ask.
  var newGrid = latLonToGrid(lat, lon);
  var current = (lastCfg.grid || '').toUpperCase();
  var comparable = current.length === 4 ? newGrid.slice(0, 4).toUpperCase() : newGrid.toUpperCase();
  if (comparable === current) return;
  var prompt = current
    ? 'Your GPS location is grid ' + newGrid + ', but your station is set to ' + current + '. Update it?'
    : 'Set your station grid to ' + newGrid + ' (from GPS)?';
  if (confirm(prompt)) setGridFromGeo(newGrid);
}

// Deep-link entry point (operator-requested 2026-09-23): a URL of the
// form map.html?grid=EM10 opens the map already framed on that grid
// square, rather than requiring the operator to pan/zoom there by hand
// from wherever the link was clicked (the callsign-info card's Grid
// square row, callinfo.js). Distinct from handleGeoReturn() above --
// that's a GPS round-trip through geo.html carrying a lat/lon *point*
// and bumping to a fixed "close enough" zoom; this carries a grid
// *square* and fits the zoom to its actual extent, so a 4-char and a
// 6-char grid both end up framed with the same margin around them
// instead of one being far tighter than the other.
// map.html?layer=psk (Tools' Who hears me card, "Show on map") opens with the PSKReporter layer on. The parameter
// is removed from the address so a reload opens with the usual defaults.
function handleLayerDeepLink() {
  var params = new URLSearchParams(location.search);
  if (params.get('layer') !== 'psk') return;
  layerState.psk = true;
  refreshLayerBtns();
  params.delete('layer');
  history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params.toString() : ''));
}
function handleGridDeepLink() {
  var params = new URLSearchParams(location.search);
  var grid = params.get('grid');
  if (!grid) return;
  history.replaceState(null, '', location.pathname);
  var bbox = gridToBBox(grid), center = gridToLatLon(grid);
  if (!bbox || !center) return;
  var canvas = document.getElementById('mapCanvas');
  var w = canvas.clientWidth, h = canvas.clientHeight;
  logMapCenterLon = center.lon;
  logMapCenterLat = center.lat;
  logMapCenterSet = true;
  // Fit the square into ~55% of the screen's shorter-constrained
  // dimension, leaving room around it -- a tight edge-to-edge crop would
  // leave no context for where the square sits relative to what's
  // around it. Whichever axis (lon or lat) needs the smaller zoom to fit
  // is the binding one, same "the tighter constraint wins" reasoning
  // computeLogMapBaseScale() itself already applies to w/360 vs h/180.
  var baseScale = computeLogMapBaseScale(w, h);
  var fitFrac = 0.55;
  var zoomForLon = (w * fitFrac) / ((bbox.lonMax - bbox.lonMin) * baseScale);
  var zoomForLat = (h * fitFrac) / ((bbox.latMax - bbox.latMin) * baseScale);
  logMapZoom = Math.min(zoomForLon, zoomForLat);
  clampLogMapView(w, h);
  renderLogMap();
}

// ===================== boot =====================
(async function boot() {
  await loadCfg(); // own-grid marker + spots' band filter want this before first render, but basemap load below doesn't depend on it
  handleGeoReturn(); // wants lastCfg.grid (just loaded) to compare against
  handleLayerDeepLink();
  handleGridDeepLink();
  // Listens while the PSKReporter layer is on; the phone's stored copy (what app.html heard) shows at once.
  PskrLive.start({
    call: function () { return lastCfg.call; },
    want: function () { return layerState.psk; },
    changed: function () { if (layerState.psk) { renderLogMap(); updateMapNote(); } }
  });
  if (layerState.decodes) loadDecodeLocations();
  loadLogMapBasemap(); // renders as soon as the basemap itself is in, doesn't wait on data layers
  loadQsoLocations();
  // A layer that starts off loads on its first tap (the toggles above), so nothing is fetched for it here.
  if (layerState.pota !== 'off' || layerState.sota !== 'off') loadSpotLocations();
})();
</script>
