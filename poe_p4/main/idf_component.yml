## IDF Component Manager Manifest File
dependencies:
  idf:
    version: '>=5.0'
  # USB Host CDC for CAT (docs/architecture/main_board.md (P4 (M5Stack Unit PoE-P4, U213))). Pinned exact, same version and
  # same reason as the ADV's main/idf_component.yml: a fresh component-
  # manager resolve otherwise drifts this to the newest 2.x, and CAT is a
  # field-only path this row exists specifically to prove, not to re-verify
  # against a moving dependency.
  espressif/usb_host_cdc_acm: 2.2.0
  # USB Host UAC for QMX RX decode audio (docs/architecture/main_board.md (P4 (M5Stack Unit PoE-P4, U213))). Pinned to the
  # same version as the ADV's main/idf_component.yml, for the same reason:
  # this is a field-only path, not something to re-verify against a moving
  # dependency on every component-manager resolve.
  espressif/usb_host_uac: 1.3.3
  espressif/usb: 1.1.0
  # I29: same LittleFS component/version as ADV main/ and sidekick web root.
  joltwallet/littlefs: "1.22.3"
