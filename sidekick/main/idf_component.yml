dependencies:
  # mDNS so the sidekick answers to micro-ft8.local instead of an IP the operator
  # has to read off a serial console. Pinned exact, matching how the main board pins
  # its managed components: a floating version means a fresh resolve on another
  # machine can silently change what ships.
  espressif/mdns: "1.8.2"
  # Web root FS (I28c / docs/architecture/sidekick.md (Web root)). Pinned exact for the same reason as mdns.
  joltwallet/littlefs: "1.22.3"
