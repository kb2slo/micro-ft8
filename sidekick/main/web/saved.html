<title>Saved</title>

<!--
  Sent after credentials are stored, before the restart. Answering first
  matters: the phone is on our AP and the AP goes away the moment we switch to
  station mode, so telling the operator what is about to happen is the
  difference between "it worked" and "it hung".
-->

<body style='font-family:system-ui;margin:2rem'>
<h2>Saved</h2>
<p>The sidekick is restarting to join that network, and this network will
disappear. Reconnect your phone to your own WiFi, then tap Open the app.</p>
<!-- One wording for a Safari tab and the Home Screen, where there is no address to type. The link
     carries the pairing token (provision.html, carryLink()), so a phone that set up at 192.168.4.1
     stays paired at micro-ft8.local. -->
<p><a id=homeLink href="http://micro-ft8.local/app.html" style='display:inline-block;padding:.7rem 1.4rem;border-radius:.6rem;background:#1d4ed8;color:#fff;text-decoration:none;font-weight:600'>Open the app</a></p>

<script src=/pairing.js></script>
