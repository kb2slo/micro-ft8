<!doctype html>
<meta name=viewport content='width=device-width,initial-scale=1'>
<title>Install the published build</title>

<!--
  Recovery when the app will not load (docs/architecture/sidekick.md (Web root)): the station's
  channel's published build, installed with the same request the app's Update makes
  (POST /api/fw/start), every board that differs from it, the main board first. Served from the
  image, so it works whatever app is served. Needs no crypto.subtle (unavailable on plain HTTP):
  the sidekick checks each image against the hash the manifest, read here over HTTPS, gives.
-->

<style>
body{font-family:system-ui;margin:2rem auto;max-width:24rem;padding:0 1rem;line-height:1.4}
button{width:100%;padding:.7rem;font-size:1rem;margin-top:1rem}
#m{color:#666;font-size:.85rem;min-height:1.2em;white-space:pre-wrap}
a{color:#06c}
</style>

<h2>Install the published build</h2>
<p>Puts this station back on its channel's published build, the app with it. Switch the radio off first.</p>
<button id=go type=button disabled>Install</button>
<p id=m></p>
<p><a href="/app.html">Open app</a></p>

<script src=/pairing.js></script>
<script>
// The same URLs and checks as the app's update (webapp/app/updates.js), kept here so this page
// needs nothing of the app.
var MANIFEST_URLS = {
  dev: 'https://micro-ft8.kalikstein.com/download/manifest.json',
  stable: 'https://micro-ft8.kalikstein.com/download/manifest-stable.json'
};
var IMAGE_BASE = 'http://micro-ft8.kalikstein.com/download/ota/';
// The main board first, while the sidekick still speaks its protocol.
var BOARDS = [{ board: 'main', asset: 'poe_p4', running: 'host' }, { board: 'sidekick', asset: 'sidekick', running: 'running' }];
// What each state of an update reads as; `name` is the board in hand, `pct` its progress or ''.
function stateText(state, name, pct) {
  if (state === 'downloading') return 'Downloading the ' + name + '\u2019s image' + pct;
  if (state === 'verifying') return 'Checking the ' + name + '\u2019s image';
  if (state === 'transferring') return 'Sending the image to the main board' + pct;
  if (state === 'restarting') return 'Restarting the ' + name;
  return 'Working\u2026';
}

var m = document.getElementById('m');
var go = document.getElementById('go');
function setMsg(t) { m.textContent = t; }

// fetch() has no timeout: on a network that routes nowhere it hangs.
function fetchTimeout(url, ms) {
  var ctl = new AbortController();
  var t = setTimeout(function () { ctl.abort(); }, ms);
  return fetch(url, { signal: ctl.signal, cache: 'no-store' }).finally(function () { clearTimeout(t); });
}

function otaOk(o) {
  return !!o && typeof o.filename === 'string' && /^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(o.filename) &&
    typeof o.size === 'number' && o.size > 0 && o.size % 1 === 0 &&
    typeof o.sha256 === 'string' && /^[0-9a-f]{64}$/.test(o.sha256) &&
    typeof o.version === 'string' && /^[!#-\[\]-~]{1,31}$/.test(o.version);
}

// A station's channel is its main board's: a release is stable, anything else dev.
function channelOf(hostVersion) {
  return /^\d+\.\d+\.\d+\+[0-9a-f]{7}$/.test(hostVersion || '') ? 'stable' : 'dev';
}

async function status() {
  var r = await fetchTimeout('/api/fw/status', 5000);
  if (!r.ok) throw new Error('status HTTP ' + r.status);
  return r.json();
}

var sleep = function (ms) { return new Promise(function (res) { setTimeout(res, ms); }); };

// Follows the update to its end. The sidekick does not answer while it restarts, and comes back
// idle: once an update has been seen running, idle is its end, and `last` says what came of it.
// A restart can fall between two polls, so none need fail for that.
async function follow() {
  var seen = false, idleSince = Date.now();
  for (;;) {
    await sleep(2000);
    var s;
    try { s = await status(); } catch (e) { seen = true; setMsg('Restarting\u2026'); continue; }
    if (s.state === 'failed') {
      setMsg('The update failed: ' + s.why + (s.at ? ' (' + s.at + ')' : '') + '. Tap Install to try again.');
      go.disabled = false;
      return;
    }
    if (s.state === 'done' || (seen && s.state === 'idle')) {
      var bad = s.last && s.last.result === 'rolled_back';
      setMsg(bad ? 'The sidekick went back to the build it ran before. Tap Install to try again.'
        : 'Done. Switch the radio back on, then open the app.');
      go.disabled = false;
      return;
    }
    if (s.state === 'idle') {
      if (Date.now() - idleSince > 10000) {
        setMsg('The sidekick shows no update running. Tap Install to try again.');
        go.disabled = false;
        return;
      }
      continue;
    }
    seen = true;
    var pct = s.size ? ' ' + Math.floor(100 * s.got / s.size) + '%' : '';
    setMsg(stateText(s.state, s.board === 'main' ? 'main board' : 'sidekick', pct));
  }
}

async function install() {
  if (!MicroFT8Pairing.getToken()) {
    setMsg('Press the pairing button first.');
    MicroFT8Pairing.needsReauth();
    return;
  }
  go.disabled = true;
  try {
    var s = await status();
    if (!s.host_linked || !s.host) {
      throw new Error('This needs the main board connected to the sidekick. Without it, flash the sidekick over USB from the downloads page.');
    }
    if (!s.online) {
      throw new Error('This needs the sidekick on WiFi with internet; it is on its own network. Without it, flash over USB from the downloads page.');
    }
    var channel = channelOf(s.host);
    setMsg('Reading the ' + channel + ' channel’s build…');
    var mr;
    try {
      mr = await fetchTimeout(MANIFEST_URLS[channel], 15000);
    } catch (e) {
      throw new Error('Could not reach the release host. This phone needs internet.');
    }
    if (!mr.ok) throw new Error('manifest HTTP ' + mr.status);
    var manifest = await mr.json();
    var lines = [];
    BOARDS.forEach(function (b) {
      var o = manifest.assets && manifest.assets[b.asset] && manifest.assets[b.asset].ota;
      if (!otaOk(o) || o.version === s[b.running]) return;
      lines.push('board=' + b.board + '\nurl=' + IMAGE_BASE + o.filename + '\nsize=' + o.size +
        '\nsha256=' + o.sha256 + '\nversion=' + o.version + '\n');
    });
    if (!lines.length) {
      setMsg('This station already runs the published build (' + s.running + ').');
      go.disabled = false;
      return;
    }
    var r = await MicroFT8Pairing.authFetch('/api/fw/start', { method: 'POST', body: lines.join('next\n') });
    if (r.status === 401) {
      MicroFT8Pairing.needsReauth();
      throw new Error('Press the pairing button.');
    }
    if (!r.ok) throw new Error('The sidekick refused: ' + (await r.text()));
    setMsg('Started.');
    follow();
  } catch (e) {
    setMsg(String(e && e.message ? e.message : e));
    go.disabled = false;
  }
}

MicroFT8Pairing.boot({
  status: m,
  onPaired: function () { setMsg('Paired, ready to install'); go.disabled = false; }
});
if (MicroFT8Pairing.getToken()) {
  setMsg('Paired, ready to install');
  go.disabled = false;
} else {
  setMsg('Press the pairing button');
}
go.onclick = install;
</script>
