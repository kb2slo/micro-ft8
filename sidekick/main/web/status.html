<!doctype html>
<meta name=viewport content='width=device-width,initial-scale=1'>
<title>Micro-FT8 sidekick</title>

<!--
  Station-mode status, served at / once joined. Open to anyone who can reach
  it: this is a read of radio state, and anyone may listen (RFC 0004 section 7).

  Every placeholder below is HTML-escaped on the way in. The network name is
  the reason that is not optional -- an SSID is whatever a nearby access point
  broadcast, chosen from a scan list, and this origin holds the pairing token
  in localStorage.

  Pairing is shared via /pairing.js: press the sidekick button; no prompt().
-->

<style>
body{font-family:system-ui;margin:2rem auto;max-width:22rem;padding:0 1rem}
dt{color:#666;font-size:.8rem;margin-top:.7rem}
dd{margin:0;font-size:1rem}
button{width:100%;padding:.7rem;font-size:1rem;margin-top:1.5rem}
#m{color:#666;font-size:.85rem;min-height:1.2em}
</style>

<h2>Micro-FT8 sidekick</h2>
<dl>
  <dt>Network</dt><dd>{{ssid}}</dd>
  <dt>Address</dt><dd>{{ip}}</dd>
  <dt>Firmware</dt><dd>{{version}}</dd>
  <dt>Uptime</dt><dd>{{uptime}}</dd>
</dl>

<p><a href="/app.html">App &rarr;</a></p>
<p><a href="/log">ADV log and decodes &rarr;</a></p>
<p><a href="/update">Install / update app &rarr;</a></p>

<button id=f>Forget WiFi</button>
<button id=ap type=button>Enter AP mode</button>
<button id=rh type=button>Restore seed pages</button>
<p id=m></p>

<script src=/pairing.js></script>
<script>
var m = document.getElementById('m');

MicroFT8Pairing.boot({
  status: m,
  onPaired: function () { m.textContent = 'Paired' }
});

document.getElementById('f').onclick = async function () {
  if (!confirm('Forget this network and restart into setup?')) return;
  if (!MicroFT8Pairing.getToken()) {
    m.textContent = 'Press the sidekick button to pair first.';
    MicroFT8Pairing.needsReauth();
    return
  }
  var r = await MicroFT8Pairing.authFetch('/forget', { method: 'POST' });
  if (r.status == 401) {
    MicroFT8Pairing.needsReauth();
    m.textContent = 'Press the sidekick button to pair';
  } else {
    document.body.innerHTML = '<h2>Forgotten</h2>'
      + '<p>Restarting into setup. Look for the <b>micro-ft8.local-…</b> network.</p>'
  }
}

// B55 (RFC 0004 §1): deliberate entry into AP mode, ahead of a trip, while
// still on a working network. Same shape as #f above -- token check, POST,
// 401 handling -- since both tear down the network this page is reachable
// on. Credentials are kept (wifi_prov_enter_ap_and_restart() does not erase
// them), so the portal's own WiFi-join form is already the way back.
document.getElementById('ap').onclick = async function () {
  if (!confirm('Switch to AP mode? Your phone will need to join the sidekick\'s own network afterward.')) return;
  if (!MicroFT8Pairing.getToken()) {
    m.textContent = 'Press the sidekick button to pair first.';
    MicroFT8Pairing.needsReauth();
    return
  }
  var r = await MicroFT8Pairing.authFetch('/ap-mode', { method: 'POST' });
  if (r.status == 401) {
    MicroFT8Pairing.needsReauth();
    m.textContent = 'Press the sidekick button to pair';
  } else {
    document.body.innerHTML = '<h2>Switching to AP mode</h2>'
      + '<p>Look for the <b>micro-ft8.local-…</b> network.</p>'
  }
}

// In-page confirm (not window.confirm): phones often dismiss the native
// dialog with no status text and no POST, which looked like a dead button.
var rhArmed = false;
document.getElementById('rh').onclick = async function () {
  if (!MicroFT8Pairing.getToken()) {
    rhArmed = false;
    m.textContent = 'Press the sidekick button to pair first.';
    MicroFT8Pairing.needsReauth();
    return;
  }
  if (!rhArmed) {
    rhArmed = true;
    m.textContent = 'Tap Restore again to rewrite seed pages (app files kept).';
    return;
  }
  rhArmed = false;
  m.textContent = 'Restoring…';
  try {
    var r = await MicroFT8Pairing.authFetch('/api/web/rehydrate', { method: 'POST' });
    if (r.status == 401) {
      MicroFT8Pairing.needsReauth();
      m.textContent = 'Press the sidekick button to pair';
      return;
    }
    if (!r.ok) {
      m.textContent = 'Restore failed: ' + (await r.text());
      return;
    }
    m.textContent = 'Seed pages restored from firmware.';
  } catch (e) {
    m.textContent = 'Restore error: ' + (e && e.message ? e.message : e);
  }
}
</script>
