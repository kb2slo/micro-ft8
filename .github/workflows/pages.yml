# Cloudflare Worker (static assets): human landing + machine bundle under
# webapp/ (RFC 0004 §4). Path-filtered so firmware-only commits do not
# redeploy the site. Static passthrough -- no build step, webapp/ is served
# as-is at micro-ft8.kalikstein.com. Uses Workers Static Assets rather than
# classic Cloudflare Pages -- Cloudflare steers new deploys there now, and
# webapp/wrangler.jsonc's `routes` entry is what attaches the custom domain.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify manifest matches assets
        run: python3 webapp/tools/gen_manifest.py --check
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: webapp
          command: deploy
          # Script-less "assets only" Workers (no `main`) need Wrangler 4 --
          # 3.x (what the action falls back to otherwise) demands an entry
          # point even when there's nothing but static assets to serve.
          wranglerVersion: "4"
