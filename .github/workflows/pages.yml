# Cloudflare Worker (static assets): human landing + machine bundle under
# webapp/ (docs/architecture/sidekick.md (Installing the app bundle)). Path-filtered so firmware-only commits do not
# redeploy the site. webapp/ is served as-is at micro-ft8.kalikstein.com except
# webapp/app/, which is built first (webapp/tools/build.py, docs/architecture/
# webapp.md (Build)) and swapped in for its sources. Uses Workers Static Assets rather than
# classic Cloudflare Pages -- Cloudflare steers new deploys there now, and
# webapp/wrangler.jsonc's `routes` entry is what attaches the custom domain.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # This checkout is thrown away after the deploy, so the built bundle
      # simply replaces the sources at the path the sidekick installs from
      # (/app/manifest.json).
      - name: Build the web app bundle
        run: |
          npm ci --prefix webapp/tools
          python3 webapp/tools/build.py
          rm -rf webapp/app
          mv webapp/dist/app webapp/app
          rm -rf webapp/dist
      # Worker binds DOWNLOADS to this bucket; create once if missing so a fresh
      # account does not fail deploy before release-main has ever run.
      - name: Ensure R2 downloads bucket exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: webapp
          wranglerVersion: "4"
          command: r2 bucket create micro-ft8-downloads
        continue-on-error: true
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: webapp
          command: deploy
          # Script-less "assets only" Workers (no `main`) need Wrangler 4 --
          # 3.x (what the action falls back to otherwise) demands an entry
          # point even when there's nothing but static assets to serve.
          wranglerVersion: "4"
