# Cloudflare Worker (static assets): the site under webapp/ (docs/architecture/
# webapp.md (Serving the site)). Path-filtered so firmware-only commits do not
# redeploy the site. webapp/ is served as-is at micro-ft8.kalikstein.com except
# what .assetsignore leaves out (webapp/app/ among them: the app ships in the
# sidekick's image) and getting-started.html, which is generated from
# getting-started.md (webapp/tools/getting_started.mjs) and never committed. Uses Workers Static Assets rather than
# classic Cloudflare Pages -- Cloudflare steers new deploys there now, and
# webapp/wrangler.jsonc's `routes` entry is what attaches the custom domain.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # It checks the labels it quotes against the app's sources.
      - name: Build the getting-started page
        run: |
          npm ci --prefix webapp/tools
          node webapp/tools/getting_started.mjs
      # Worker binds DOWNLOADS to this bucket; create once if missing so a fresh
      # account does not fail deploy before release-main has ever run.
      - name: Ensure R2 downloads bucket exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: webapp
          wranglerVersion: "4"
          command: r2 bucket create micro-ft8-downloads
        continue-on-error: true
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: webapp
          command: deploy
          # Script-less "assets only" Workers (no `main`) need Wrangler 4 --
          # 3.x (what the action falls back to otherwise) demands an entry
          # point even when there's nothing but static assets to serve.
          wranglerVersion: "4"
