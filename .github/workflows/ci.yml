# Production firmware + host tests.
# The P4's merged image is the same POST_BUILD output as a local `idf.py build`:
#   poe_p4/build/poe_p4_merged.bin  — flash at 0x0.
#
# Firmware + the dev channel's publish run only when sources that can
# change the binary (or this workflow) change. Docs/roadmap-only commits skip
# them. How a build becomes a download: docs/RELEASE_PROCESS.md.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only unless a job asks for more; a pull request from a fork gets a read-only token anyway.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            firmware:
              - 'components/**'
              - 'sidekick/**'
              - 'poe_p4/**'
              - '**/idf_component.yml'
              - 'tools/**/*.cmake'
              - 'tools/build_version.py'
              - 'tools/check_ram_budget.py'
              - '.github/workflows/ci.yml'

  # Each step is one check of tools/check.sh, which says what it runs; a
  # contributor runs the same script locally. pages.yml only runs the web
  # build when a deploy is attempted; the first step here fails on the
  # first push instead.
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Web bundle build
        run: tools/check.sh --only web

      - name: Webapp tests
        run: tools/check.sh --only webapp

      - name: Autoseq host_mock
        run: tools/check.sh --only host_mock

      - name: Station simulator
        run: tools/check.sh --only sim

      - name: TX e2e (CTest)
        run: tools/check.sh --only tx_e2e

      - name: Decode recall
        run: tools/check.sh --only decode_recall

      - name: Recorders, capture converter and download manifest
        run: tools/check.sh --only tools

  # Links and repo paths in the docs still resolve, and no row ID newly
  # dangles (tools/check_docs.py); on a pull request, its commit messages
  # and the subject a squash merge would write (tools/check_commits.py).
  # The whole history, which both read.
  docs-and-commits:
    name: Docs and commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A pull request into another branch merges there and never reaches main.
      - name: Base branch is main
        if: github.event_name == 'pull_request'
        run: |
          if [ "$BASE_REF" != main ]; then
            echo "::error::This pull request targets '$BASE_REF'. Every pull request targets main: merge the first one, then branch from the new main."
            exit 1
          fi
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}

      - name: Docs
        run: tools/check.sh --only docs --base "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Lock files
        run: tools/check.sh --only locks

      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: tools/check.sh --only commits --base "$BASE" --head "$HEAD"
        # The title goes through the environment, never into the script itself.
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  # The printed getting-started sheet (webapp/getting-started.md), printed by
  # headless Chrome on every push: it fails when the sheet runs past its page
  # limit or quotes a label the station's UI no longer has. Both release jobs
  # post the PDF with the firmware images (docs/RELEASE_PROCESS.md).
  getting-started-sheet:
    name: Getting-started sheet (PDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Print the sheet
        run: tools/check.sh --only getting_started

      - name: Upload the sheet
        uses: actions/upload-artifact@v6
        with:
          name: getting-started-sheet
          retention-days: 30
          path: webapp/dist/getting-started.pdf

  sidekick-firmware:
    name: Sidekick (ESP32-S3)
    needs: changes
    if: startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.firmware == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      # CI checks out a synthesized merge commit for a PR, not
      # github.event.pull_request.head.sha, so a bare `git rev-parse HEAD`
      # in sidekick/CMakeLists.txt would report a SHA nobody can find.
      MICROFT8_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          # All of main's history: a dev build's number is its commit count.
          fetch-depth: 0

      # Empty for a pull request, which then reports its bare SHA
      # (tools/build_version.py; docs/RELEASE_PROCESS.md).
      - name: Version this build reports
        run: |
          version="$(python3 tools/build_version.py --ref "${GITHUB_REF}" --sha "${MICROFT8_GIT_SHA}")"
          echo "MICROFT8_VERSION=${version}" >> "$GITHUB_ENV"
          echo "version: ${version:-the commit alone}"

      - name: Build sidekick with ESP-IDF 5.5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          # Sidekick retargeted C6 -> S3 with the AtomS3 Lite pivot (I3a).
          # sidekick/CMakeLists.txt pins IDF_TARGET too; keep the two agreeing.
          target: esp32s3
          path: sidekick
          extra_docker_args: -e MICROFT8_GIT_SHA=${{ env.MICROFT8_GIT_SHA }} -e MICROFT8_VERSION=${{ env.MICROFT8_VERSION }}
          command: idf.py build

      # One 0x0 image for desk esptool, merged from the build's four pieces
      # by the same script a local flash uses; and the app image by itself,
      # which is what an over-the-air update writes.
      - name: Merge sidekick image
        run: |
          python3 -m pip install --upgrade 'esptool>=4'
          mkdir -p sidekick-out
          ./tools/merge_sidekick_bin.sh sidekick/build sidekick-out/sidekick_merged.bin
          cp sidekick/build/sidekick.bin sidekick-out/sidekick.bin

      - name: Upload sidekick firmware
        uses: actions/upload-artifact@v6
        with:
          name: sidekick-firmware
          if-no-files-found: error
          retention-days: 30
          path: |
            sidekick-out/sidekick_merged.bin
            sidekick-out/sidekick.bin

  poe_p4-firmware:
    name: PoE-P4 (ESP32-P4)
    needs: changes
    if: startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.firmware == 'true' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      # As for the sidekick: a pull request builds a synthesized merge commit,
      # and the version the image reports must be the head commit's.
      MICROFT8_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          # All of main's history: a dev build's number is its commit count.
          fetch-depth: 0

      # Empty for a pull request, which then reports its bare SHA
      # (tools/build_version.py; docs/RELEASE_PROCESS.md).
      - name: Version this build reports
        run: |
          version="$(python3 tools/build_version.py --ref "${GITHUB_REF}" --sha "${MICROFT8_GIT_SHA}")"
          echo "MICROFT8_VERSION=${version}" >> "$GITHUB_ENV"
          echo "version: ${version:-the commit alone}"

      # Separate idf.py project from sidekick/ (poe_p4/CMakeLists.txt pins
      # esp32p4).
      - name: Build poe_p4 with ESP-IDF 5.5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32p4
          path: poe_p4
          extra_docker_args: -e MICROFT8_GIT_SHA=${{ env.MICROFT8_GIT_SHA }} -e MICROFT8_VERSION=${{ env.MICROFT8_VERSION }}
          command: idf.py build

      - name: Upload poe_p4 firmware
        uses: actions/upload-artifact@v6
        with:
          name: poe_p4-firmware
          if-no-files-found: error
          retention-days: 30
          path: |
            poe_p4/build/poe_p4_merged.bin
            poe_p4/build/poe_p4.bin
            poe_p4/build/bootloader/bootloader.bin
            poe_p4/build/partition_table/partition-table.bin

  release:
    name: Publish stable (tag)
    needs: [host-tests, poe_p4-firmware, sidekick-firmware, getting-started-sheet]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          # All of main's history: the stable manifest records this commit's build number.
          fetch-depth: 0

      # Before anything is published: a stable tag goes only on a commit whose
      # dev build was published, and this is what stops a tag pushed by hand
      # (tools/cut_release.py asks the same before it tags).
      - name: Refuse a commit with no dev build
        run: python3 tools/dev_build.py --sha "${GITHUB_SHA}"

      - uses: actions/download-artifact@v7
        with:
          name: poe_p4-firmware
          path: dist-poe-p4

      - uses: actions/download-artifact@v7
        with:
          name: sidekick-firmware
          path: dist-sidekick

      - uses: actions/download-artifact@v7
        with:
          name: getting-started-sheet
          path: dist-sheet

      # Each file is named for the release's number, which no later release
      # reuses: its name on GitHub, and an OTA image's under ota/ on the mirror.
      - name: Name the release's files
        run: |
          number="${GITHUB_REF_NAME#v}"
          short="${GITHUB_SHA:0:7}"
          echo "NUMBER=${number}" >> "$GITHUB_ENV"
          mkdir -p dist
          test -s dist-poe-p4/poe_p4_merged.bin
          cp dist-poe-p4/poe_p4_merged.bin "dist/microft8-poe-p4-${number}.bin"
          test -s dist-poe-p4/poe_p4.bin
          cp dist-poe-p4/poe_p4.bin "dist/microft8-poe-p4-ota-${number}.bin"
          test -s dist-sidekick/sidekick_merged.bin
          cp dist-sidekick/sidekick_merged.bin "dist/microft8-sidekick-${number}.bin"
          test -s dist-sidekick/sidekick.bin
          cp dist-sidekick/sidekick.bin "dist/microft8-sidekick-ota-${number}.bin"
          test -s dist-sheet/getting-started.pdf
          cp dist-sheet/getting-started.pdf "dist/microft8-getting-started-${number}.pdf"
          ./tools/make_source_archive.sh dist "${short}"
          mv "dist/microft8-source-${short}.tar.gz" "dist/microft8-source-${number}.tar.gz"

      # The web app as this release: its build id carries the version
      # (webapp/tools/build.py), and the bundle goes out with the boards' images.
      - name: Build the release's app
        run: |
          version="$(python3 tools/build_version.py --ref "${GITHUB_REF}" --sha "${GITHUB_SHA}")"
          npm ci --prefix webapp/tools
          MICROFT8_VERSION="${version}" python3 webapp/tools/build.py
          cat webapp/dist/app/build.json
          tar -czf "dist/microft8-app-${NUMBER}.tar.gz" -C webapp/dist app

      # Before anything is published: it refuses an image or an app that does not report
      # this release's version (tools/make_manifest.py), and then nothing below runs.
      - name: Write the stable manifest
        run: |
          version="$(python3 tools/build_version.py --ref "${GITHUB_REF}" --sha "${GITHUB_SHA}")"
          day="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d "${GITHUB_SHA}")"
          python3 tools/make_manifest.py --commit "${GITHUB_SHA}" --version "${version}" --date "${day}" \
            --out dist/manifest-stable.json \
            --asset "poe_p4=dist/microft8-poe-p4-${NUMBER}.bin" --ota "poe_p4=dist/microft8-poe-p4-ota-${NUMBER}.bin" \
            --asset "sidekick=dist/microft8-sidekick-${NUMBER}.bin" --ota "sidekick=dist/microft8-sidekick-ota-${NUMBER}.bin" \
            --asset "source=dist/microft8-source-${NUMBER}.tar.gz" \
            --asset "getting_started=dist/microft8-getting-started-${NUMBER}.pdf" \
            --app webapp/dist/app
          cat dist/manifest-stable.json

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/microft8-poe-p4-${{ env.NUMBER }}.bin
            dist/microft8-sidekick-${{ env.NUMBER }}.bin
            dist/microft8-poe-p4-ota-${{ env.NUMBER }}.bin
            dist/microft8-sidekick-ota-${{ env.NUMBER }}.bin
            dist/microft8-source-${{ env.NUMBER }}.tar.gz
            dist/microft8-getting-started-${{ env.NUMBER }}.pdf
            dist/microft8-app-${{ env.NUMBER }}.tar.gz
            dist/manifest-stable.json
          body: |
            Micro-FT8 ${{ env.NUMBER }}, a stable release. First install and recovery, in a browser: https://micro-ft8.kalikstein.com/downloads.html

            **M5Stack Unit PoE-P4 (U213)** — `microft8-poe-p4-${{ env.NUMBER }}.bin`: the headless main board. Flash at `0x0` over the USB-C port next to the RJ45 (labeled `USB-C PROG & OTG`).

            ```
            esptool.py --chip esp32p4 write_flash 0x0 microft8-poe-p4-${{ env.NUMBER }}.bin
            ```

            **AtomS3 Lite sidekick** — `microft8-sidekick-${{ env.NUMBER }}.bin` (merged 0x0 image), whose web app is the only UI.

            ```
            esptool.py --chip esp32s3 write_flash 0x0 microft8-sidekick-${{ env.NUMBER }}.bin
            ```

            **Over-the-air images** — `microft8-poe-p4-ota-${{ env.NUMBER }}.bin` and `microft8-sidekick-ota-${{ env.NUMBER }}.bin`: each board's app image alone, which an update from the web app writes. Not for flashing at `0x0`. `manifest-stable.json` has every file's SHA-256.

            **Web app** — `microft8-app-${{ env.NUMBER }}.tar.gz`: the bundle the sidekick serves, as built for this release; an update installs it with the boards' images.

            **Source** — `microft8-source-${{ env.NUMBER }}.tar.gz`: history-free tree at this tag, including vendored `ft8_lib` (no `.git`).

            **Getting-started sheet** — `microft8-getting-started-${{ env.NUMBER }}.pdf`: the one-page US Letter sheet that goes in the box with a unit, the same text as https://micro-ft8.kalikstein.com/getting-started at this tag.

      # After the GitHub release, and the manifest last of all: it is what
      # offers the release to a station, so it never names a file that is not there.
      - name: Mirror the release to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 --version

          put() {
            local key="$1" file="$2" ctype="$3"
            npx --yes wrangler@4 r2 object put "micro-ft8-downloads/${key}" \
              --file="${file}" \
              --content-type="${ctype}" \
              --remote
          }

          put microft8-poe-p4-stable.bin "dist/microft8-poe-p4-${NUMBER}.bin" application/octet-stream
          put microft8-sidekick-stable.bin "dist/microft8-sidekick-${NUMBER}.bin" application/octet-stream
          put microft8-source-stable.tar.gz "dist/microft8-source-${NUMBER}.tar.gz" application/gzip
          put microft8-getting-started-stable.pdf "dist/microft8-getting-started-${NUMBER}.pdf" application/pdf
          put microft8-poe-p4-stable-ota.bin "dist/microft8-poe-p4-ota-${NUMBER}.bin" application/octet-stream
          put microft8-sidekick-stable-ota.bin "dist/microft8-sidekick-ota-${NUMBER}.bin" application/octet-stream
          # Each OTA image again under its own name, which is never overwritten: what an update downloads.
          put "ota/microft8-poe-p4-ota-${NUMBER}.bin" "dist/microft8-poe-p4-ota-${NUMBER}.bin" application/octet-stream
          put "ota/microft8-sidekick-ota-${NUMBER}.bin" "dist/microft8-sidekick-ota-${NUMBER}.bin" application/octet-stream
          # The app's bundle under the release's number, never overwritten either. Its assets are
          # stored as built, gzipped under their own names (webapp/tools/build.py), so as bytes;
          # only its manifest and build.json are JSON as they are.
          for f in webapp/dist/app/*; do
            name="$(basename "${f}")"
            case "${name}" in
              manifest.json|build.json) ctype='application/json; charset=utf-8' ;;
              *) ctype=application/octet-stream ;;
            esac
            put "app/${NUMBER}/${name}" "${f}" "${ctype}"
          done
          put manifest-stable.json dist/manifest-stable.json 'application/json; charset=utf-8'

  release-main:
    name: Publish dev (main)
    needs: [host-tests, poe_p4-firmware, sidekick-firmware, getting-started-sheet]
    # A run started by hand on main publishes too: it is how a commit that changed no firmware
    # gets the dev build a stable tag needs (tools/dev_build.py; docs/RELEASE_PROCESS.md).
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          # All of main's history, to count this build's number as the firmware jobs did.
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: poe_p4-firmware
          path: dist-poe-p4

      - uses: actions/download-artifact@v7
        with:
          name: sidekick-firmware
          path: dist-sidekick

      - uses: actions/download-artifact@v7
        with:
          name: getting-started-sheet
          path: dist-sheet

      # Each file's dated name, which the manifest records and an OTA image is
      # kept under on the mirror. Date is the *commit* date in UTC, not the build date, so rebuilding a
      # commit reproduces the name. `microft8` is the one string here that a
      # project rename would have to change (docs/RELEASE_PROCESS.md).
      - name: Name the PoE-P4 images
        run: |
          mkdir -p dist
          short="${GITHUB_SHA:0:7}"
          day="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d "${GITHUB_SHA}")"
          echo "SHORT_SHA=${short}" >> "$GITHUB_ENV"
          echo "DAY=${day}" >> "$GITHUB_ENV"

          test -f "dist-poe-p4/poe_p4_merged.bin"
          asset_p4="${day}-microft8-poe-p4-${short}.bin"
          cp "dist-poe-p4/poe_p4_merged.bin" "dist/${asset_p4}"
          echo "ASSET_P4=${asset_p4}" >> "$GITHUB_ENV"

          # The app image by itself: what an over-the-air update writes.
          asset_p4_ota="${day}-microft8-poe-p4-ota-${short}.bin"
          test -s dist-poe-p4/poe_p4.bin
          cp dist-poe-p4/poe_p4.bin "dist/${asset_p4_ota}"
          echo "ASSET_P4_OTA=${asset_p4_ota}" >> "$GITHUB_ENV"

      - name: Name sidekick image + source archive
        run: |
          short="${SHORT_SHA}"
          day="${DAY}"
          asset_sk="${day}-microft8-sidekick-${short}.bin"
          test -s dist-sidekick/sidekick_merged.bin
          cp dist-sidekick/sidekick_merged.bin "dist/${asset_sk}"
          echo "ASSET_SK=${asset_sk}" >> "$GITHUB_ENV"

          asset_sk_ota="${day}-microft8-sidekick-ota-${short}.bin"
          test -s dist-sidekick/sidekick.bin
          cp dist-sidekick/sidekick.bin "dist/${asset_sk_ota}"
          echo "ASSET_SK_OTA=${asset_sk_ota}" >> "$GITHUB_ENV"

          ./tools/make_source_archive.sh dist "${short}"
          asset_src="microft8-source-${short}.tar.gz"
          test -f "dist/${asset_src}"
          dated_src="${day}-microft8-source-${short}.tar.gz"
          mv "dist/${asset_src}" "dist/${dated_src}"
          echo "ASSET_SRC=${dated_src}" >> "$GITHUB_ENV"

      - name: Name the getting-started sheet
        run: |
          asset_gs="${DAY}-microft8-getting-started-${SHORT_SHA}.pdf"
          test -s dist-sheet/getting-started.pdf
          cp dist-sheet/getting-started.pdf "dist/${asset_gs}"
          echo "ASSET_GS=${asset_gs}" >> "$GITHUB_ENV"

      # Before anything is published: it refuses an OTA image a board would
      # refuse (tools/make_manifest.py), and then nothing below runs.
      - name: Write the download manifest
        run: |
          version="$(python3 tools/build_version.py --ref "${GITHUB_REF}" --sha "${GITHUB_SHA}")"
          python3 tools/make_manifest.py --commit "${GITHUB_SHA}" --version "${version}" --date "${DAY}" \
            --out dist/manifest.json \
            --asset "poe_p4=dist/${ASSET_P4}" --ota "poe_p4=dist/${ASSET_P4_OTA}" \
            --asset "sidekick=dist/${ASSET_SK}" --ota "sidekick=dist/${ASSET_SK_OTA}" \
            --asset "source=dist/${ASSET_SRC}" \
            --asset "getting_started=dist/${ASSET_GS}"
          cat dist/manifest.json

      - name: Mirror dev assets to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 --version

          cp "dist/${ASSET_P4}" dist/microft8-poe-p4-dev.bin
          cp "dist/${ASSET_P4_OTA}" dist/microft8-poe-p4-dev-ota.bin
          cp "dist/${ASSET_SK}" dist/microft8-sidekick-dev.bin
          cp "dist/${ASSET_SK_OTA}" dist/microft8-sidekick-dev-ota.bin
          cp "dist/${ASSET_SRC}" dist/microft8-source-dev.tar.gz
          cp "dist/${ASSET_GS}" dist/microft8-getting-started-dev.pdf

          put() {
            local key="$1" file="$2" ctype="$3"
            npx --yes wrangler@4 r2 object put "micro-ft8-downloads/${key}" \
              --file="${file}" \
              --content-type="${ctype}" \
              --remote
          }

          put microft8-poe-p4-dev.bin dist/microft8-poe-p4-dev.bin application/octet-stream
          put microft8-sidekick-dev.bin dist/microft8-sidekick-dev.bin application/octet-stream
          put microft8-source-dev.tar.gz dist/microft8-source-dev.tar.gz application/gzip
          put microft8-getting-started-dev.pdf dist/microft8-getting-started-dev.pdf application/pdf
          put microft8-poe-p4-dev-ota.bin dist/microft8-poe-p4-dev-ota.bin application/octet-stream
          put microft8-sidekick-dev-ota.bin dist/microft8-sidekick-dev-ota.bin application/octet-stream
          # Each OTA image again under its dated name, which is never overwritten: an update in the
          # web app downloads the build the operator accepted even if another is published meanwhile.
          # Kept, never expired: the published build can be months old (docs/RELEASE_PROCESS.md).
          put "ota/${ASSET_P4_OTA}" "dist/${ASSET_P4_OTA}" application/octet-stream
          put "ota/${ASSET_SK_OTA}" "dist/${ASSET_SK_OTA}" application/octet-stream
          # Last: a manifest never names an image that is not there yet.
          put manifest.json dist/manifest.json 'application/json; charset=utf-8'
