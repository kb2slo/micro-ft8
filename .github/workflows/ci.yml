# Production firmware + host tests.
# The P4's merged image is the same POST_BUILD output as a local `idf.py build`:
#   poe_p4/build/poe_p4_merged.bin  — flash at 0x0.
#
# Firmware + the rolling `continuous` release run only when sources that can
# change the binary (or this workflow) change. Docs/roadmap-only commits skip
# them. How a build becomes a download: docs/RELEASE_PROCESS.md.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            firmware:
              - 'components/**'
              - 'sidekick/**'
              - 'poe_p4/**'
              - '**/idf_component.yml'
              - 'tools/**/*.cmake'
              - '.github/workflows/ci.yml'

  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      # The same build pages.yml deploys (docs/architecture/webapp.md
      # (Build)): minify, compile-check every script, write the manifest,
      # hold the size budget. pages.yml only runs when a deploy is
      # attempted; this fails on the first push instead.
      - name: Web bundle build
        run: |
          npm ci --prefix webapp/tools
          python3 webapp/tools/build.py

      # Extracts and runs the real batching functions out of app.html (no
      # separate re-implementation to drift from the source) -- see the
      # test's own header comment.
      - name: Webapp decode-batching test
        run: node webapp/tests/test_decode_batching.js

      # The n-fer export (architecture/logging.md) and the SWR sweep's plan and plot (docs/architecture/webapp.md, The SWR sweep).
      - name: Webapp n-fer export test
        run: node webapp/tests/test_nfer_export.js

      - name: Webapp SWR sweep test
        run: node webapp/tests/test_swr_core.js

      # Who hears me (docs/architecture/webapp.md): the MQTT packets, the reader, spots and gaps.
      - name: Webapp who-hears-me test
        run: |
          node webapp/tests/test_pskr_core.js
          node webapp/tests/test_pskr_live.js

      - name: Autoseq host_mock
        working-directory: host_mock
        run: |
          make -j"$(nproc)"
          failed=0
          # Scenario runner: one pass per JSON fixture.
          for f in test_*.json; do
            echo "===== $f ====="
            ./host_test "$f" || failed=1
          done
          # Every other host_test_* binary the Makefile produced. Globbed on
          # purpose: this list used to be maintained by hand, and four tests
          # (station, decode_sort, power_hysteresis, qso_browse) had silently
          # never run in CI because nobody added them here when they landed.
          ran=0
          for t in host_test_*; do
            [ -x "$t" ] || continue
            [ -d "$t" ] && continue
            case "$t" in *.exe) continue;; esac
            echo "===== $t ====="
            ./"$t" || failed=1
            ran=$((ran + 1))
          done
          echo "ran $ran host_test_* binaries"
          # A Makefile or glob change that silently stops running the suite
          # should fail loudly rather than pass with zero tests.
          if [ "$ran" -lt 15 ]; then
            echo "::error::expected at least 15 host_test_* binaries, ran $ran"
            failed=1
          fi
          exit "$failed"

      - name: Station simulator HTTP
        run: node webapp/tests/test_sim_station.js

      - name: Station simulator SWR sweep
        run: node webapp/tests/test_sim_sweep.js

      - name: TX e2e (CTest)
        working-directory: tests/tx_e2e
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure

      # RFC 0006 P1. Truth is committed; this does not run jt9. It clones
      # howard0su/ft8_lib at the pinned SHA for the 20m_busy WAVs.
      - name: Decode recall
        run: python3 tools/decode_recall/report.py

  # The printed getting-started sheet (webapp/getting-started.md), printed by
  # headless Chrome on every push: it fails when the sheet runs past its page
  # limit or quotes a label the station's UI no longer has. Both release jobs
  # post the PDF with the firmware images (docs/RELEASE_PROCESS.md).
  getting-started-sheet:
    name: Getting-started sheet (PDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Print the sheet
        run: |
          npm ci --prefix webapp/tools
          node webapp/tools/getting_started.mjs --pdf

      - name: Upload the sheet
        uses: actions/upload-artifact@v6
        with:
          name: getting-started-sheet
          retention-days: 30
          path: webapp/dist/getting-started.pdf

  sidekick-firmware:
    name: Sidekick (ESP32-S3)
    needs: changes
    if: startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    env:
      # CI checks out a synthesized merge commit for a PR, not
      # github.event.pull_request.head.sha, so a bare `git rev-parse HEAD`
      # in sidekick/CMakeLists.txt would report a SHA nobody can find.
      MICROFT8_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Build sidekick with ESP-IDF 5.5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          # Sidekick retargeted C6 -> S3 with the AtomS3 Lite pivot (I3a).
          # sidekick/CMakeLists.txt pins IDF_TARGET too; keep the two agreeing.
          target: esp32s3
          path: sidekick
          extra_docker_args: -e MICROFT8_GIT_SHA=${{ env.MICROFT8_GIT_SHA }}
          command: idf.py build

      # One 0x0 image for desk esptool, merged from the build's four pieces
      # by the same script a local flash uses.
      - name: Merge sidekick image
        run: |
          python3 -m pip install --upgrade 'esptool>=4'
          mkdir -p sidekick-out
          ./tools/merge_sidekick_bin.sh sidekick/build sidekick-out/sidekick_merged.bin

      - name: Upload sidekick firmware
        uses: actions/upload-artifact@v6
        with:
          name: sidekick-firmware
          if-no-files-found: error
          retention-days: 30
          path: sidekick-out/sidekick_merged.bin

  poe_p4-firmware:
    name: PoE-P4 (ESP32-P4)
    needs: changes
    if: startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      # Separate idf.py project from sidekick/ (poe_p4/CMakeLists.txt pins
      # esp32p4).
      - name: Build poe_p4 with ESP-IDF 5.5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32p4
          path: poe_p4
          command: idf.py build

      - name: Upload poe_p4 firmware
        uses: actions/upload-artifact@v6
        with:
          name: poe_p4-firmware
          if-no-files-found: error
          retention-days: 30
          path: |
            poe_p4/build/poe_p4_merged.bin
            poe_p4/build/poe_p4.bin
            poe_p4/build/bootloader/bootloader.bin
            poe_p4/build/partition_table/partition-table.bin

  release:
    name: GitHub Release (tag)
    needs: [host-tests, poe_p4-firmware, getting-started-sheet]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: poe_p4-firmware
          path: dist-poe-p4

      - uses: actions/download-artifact@v7
        with:
          name: getting-started-sheet
          path: dist-sheet

      - name: Name tagged binaries
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist
          test -f "dist-poe-p4/poe_p4_merged.bin"
          cp "dist-poe-p4/poe_p4_merged.bin" "dist/MicroFT8-PoE-P4-${tag}-Merged.bin"
          sha256sum "dist/MicroFT8-PoE-P4-${tag}-Merged.bin" | tee "dist/MicroFT8-PoE-P4-${tag}-Merged.bin.sha256"
          test -s dist-sheet/getting-started.pdf
          cp dist-sheet/getting-started.pdf "dist/MicroFT8-Getting-Started-${tag}.pdf"
          sha256sum "dist/MicroFT8-Getting-Started-${tag}.pdf" | tee "dist/MicroFT8-Getting-Started-${tag}.pdf.sha256"

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/MicroFT8-PoE-P4-${{ github.ref_name }}-Merged.bin
            dist/MicroFT8-PoE-P4-${{ github.ref_name }}-Merged.bin.sha256
            dist/MicroFT8-Getting-Started-${{ github.ref_name }}.pdf
            dist/MicroFT8-Getting-Started-${{ github.ref_name }}.pdf.sha256
          body: |
            M5Stack Unit PoE-P4 (U213): the headless main board -- pair it with a sidekick, whose web app is the only UI. Flash at `0x0` over the USB-C port next to the RJ45 (labeled `USB-C PROG & OTG`).

            ```
            esptool.py --chip esp32p4 write_flash 0x0 MicroFT8-PoE-P4-${{ github.ref_name }}-Merged.bin
            ```

            **Getting-started sheet** — `MicroFT8-Getting-Started-${{ github.ref_name }}.pdf`: the one-page US Letter sheet that goes in the box with a unit, the same text as https://micro-ft8.kalikstein.com/getting-started at this tag.

  release-main:
    name: GitHub Release (main)
    needs: [host-tests, poe_p4-firmware, sidekick-firmware, getting-started-sheet]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      # Move the rolling tag ourselves, and keep this step. GitHub's release API
      # honours target_commitish only when it *creates* a tag and ignores it
      # ever after, so handing it to action-gh-release places the tag once and
      # then silently freezes it there while the body and assets keep updating
      # correctly on top -- a stale ref behind a current download, which nothing
      # surfaces. docs/RELEASE_PROCESS.md.
      - name: Move the continuous tag to this commit
        run: git push --force origin ${{ github.sha }}:refs/tags/continuous

      - uses: actions/download-artifact@v7
        with:
          name: poe_p4-firmware
          path: dist-poe-p4

      - uses: actions/download-artifact@v7
        with:
          name: sidekick-firmware
          path: dist-sidekick

      - uses: actions/download-artifact@v7
        with:
          name: getting-started-sheet
          path: dist-sheet

      # Self-identifying on disk: several of these land in one Downloads folder
      # during a bench session, where a fixed name plus "(3)" says nothing.
      # Date is the *commit* date in UTC, not the build date, so rebuilding a
      # commit reproduces the name. `microft8` is the one string here that a
      # project rename would have to change (docs/RELEASE_PROCESS.md).
      - name: Name rolling main binary
        run: |
          mkdir -p dist
          short="${GITHUB_SHA:0:7}"
          day="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d "${GITHUB_SHA}")"
          echo "SHORT_SHA=${short}" >> "$GITHUB_ENV"
          echo "DAY=${day}" >> "$GITHUB_ENV"

          test -f "dist-poe-p4/poe_p4_merged.bin"
          asset_p4="${day}-microft8-poe-p4-${short}.bin"
          cp "dist-poe-p4/poe_p4_merged.bin" "dist/${asset_p4}"
          sha256sum "dist/${asset_p4}" | tee "dist/${asset_p4}.sha256"
          echo "ASSET_P4=${asset_p4}" >> "$GITHUB_ENV"

      - name: Name sidekick image + source archive
        run: |
          short="${SHORT_SHA}"
          day="${DAY}"
          asset_sk="${day}-microft8-sidekick-${short}.bin"
          test -s dist-sidekick/sidekick_merged.bin
          cp dist-sidekick/sidekick_merged.bin "dist/${asset_sk}"
          sha256sum "dist/${asset_sk}" | tee "dist/${asset_sk}.sha256"
          echo "ASSET_SK=${asset_sk}" >> "$GITHUB_ENV"

          ./tools/make_source_archive.sh dist "${short}"
          asset_src="microft8-source-${short}.tar.gz"
          test -f "dist/${asset_src}"
          # Dated name for the GitHub release (stable name is the R2 mirror only).
          dated_src="${day}-microft8-source-${short}.tar.gz"
          mv "dist/${asset_src}" "dist/${dated_src}"
          mv "dist/${asset_src}.sha256" "dist/${dated_src}.sha256"
          echo "ASSET_SRC=${dated_src}" >> "$GITHUB_ENV"

      - name: Name the getting-started sheet
        run: |
          asset_gs="${DAY}-microft8-getting-started-${SHORT_SHA}.pdf"
          test -s dist-sheet/getting-started.pdf
          cp dist-sheet/getting-started.pdf "dist/${asset_gs}"
          sha256sum "dist/${asset_gs}" | tee "dist/${asset_gs}.sha256"
          echo "ASSET_GS=${asset_gs}" >> "$GITHUB_ENV"

      # The asset name changes every merge, so uploads would otherwise pile up
      # on this one rolling release forever. Clear the old ones; the release
      # object itself is kept, so its page and tag survive.
      - name: Clear previous rolling assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view continuous >/dev/null 2>&1; then
            gh release view continuous --json assets -q '.assets[].name' | while read -r old; do
              [ -n "$old" ] || continue
              gh release delete-asset continuous "$old" --yes
            done
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: continuous
          name: Micro-FT8 continuous (${{ env.SHORT_SHA }})
          prerelease: true
          make_latest: false
          files: |
            dist/${{ env.ASSET_P4 }}
            dist/${{ env.ASSET_P4 }}.sha256
            dist/${{ env.ASSET_SK }}
            dist/${{ env.ASSET_SK }}.sha256
            dist/${{ env.ASSET_SRC }}
            dist/${{ env.ASSET_SRC }}.sha256
            dist/${{ env.ASSET_GS }}
            dist/${{ env.ASSET_GS }}.sha256
          body: |
            Rolling firmware from `main`, rebuilt on every merge that can change the binary. Not a versioned release — see `docs/RELEASE_PROCESS.md`.

            Public anonymous downloads (stable names): https://micro-ft8.kalikstein.com/downloads.html

            - Commit: `${{ github.sha }}`

            **M5Stack Unit PoE-P4 (U213)** — download: `${{ env.ASSET_P4 }}`. Flash at `0x0` over the USB-C port next to the RJ45 (labeled `USB-C PROG & OTG`).

            ```
            esptool.py --chip esp32p4 write_flash 0x0 ${{ env.ASSET_P4 }}
            ```

            **AtomS3 Lite sidekick** — download: `${{ env.ASSET_SK }}` (merged 0x0 image). Desk flash.

            ```
            esptool.py --chip esp32s3 write_flash 0x0 ${{ env.ASSET_SK }}
            ```

            **Source** — `${{ env.ASSET_SRC }}`: history-free tree at this commit, including vendored `ft8_lib` (no `.git`).

            **Getting-started sheet** — `${{ env.ASSET_GS }}`: the one-page US Letter sheet that goes in the box with a unit, the same text as https://micro-ft8.kalikstein.com/getting-started at this commit.

      - name: Mirror continuous assets to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 --version

          sha256_of() { awk '{print $1}' "$1"; }

          P4_SHA="$(sha256_of "dist/${ASSET_P4}.sha256")"
          SK_SHA="$(sha256_of "dist/${ASSET_SK}.sha256")"
          SRC_SHA="$(sha256_of "dist/${ASSET_SRC}.sha256")"
          GS_SHA="$(sha256_of "dist/${ASSET_GS}.sha256")"

          cp "dist/${ASSET_P4}" dist/microft8-poe-p4-continuous.bin
          cp "dist/${ASSET_SK}" dist/microft8-sidekick-continuous.bin
          cp "dist/${ASSET_SRC}" dist/microft8-source-continuous.tar.gz
          cp "dist/${ASSET_GS}" dist/microft8-getting-started-continuous.pdf

          cat > dist/manifest.json <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "short": "${SHORT_SHA}",
            "date": "${DAY}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "assets": {
              "poe_p4": {
                "stable": "microft8-poe-p4-continuous.bin",
                "filename": "${ASSET_P4}",
                "sha256": "${P4_SHA}",
                "chip": "esp32p4",
                "flash_offset": "0x0"
              },
              "sidekick": {
                "stable": "microft8-sidekick-continuous.bin",
                "filename": "${ASSET_SK}",
                "sha256": "${SK_SHA}",
                "chip": "esp32s3",
                "flash_offset": "0x0"
              },
              "source": {
                "stable": "microft8-source-continuous.tar.gz",
                "filename": "${ASSET_SRC}",
                "sha256": "${SRC_SHA}"
              },
              "getting_started": {
                "stable": "microft8-getting-started-continuous.pdf",
                "filename": "${ASSET_GS}",
                "sha256": "${GS_SHA}"
              }
            }
          }
          EOF

          put() {
            local key="$1" file="$2" ctype="$3"
            npx --yes wrangler@4 r2 object put "micro-ft8-downloads/${key}" \
              --file="${file}" \
              --content-type="${ctype}" \
              --remote
          }

          put microft8-poe-p4-continuous.bin dist/microft8-poe-p4-continuous.bin application/octet-stream
          put microft8-sidekick-continuous.bin dist/microft8-sidekick-continuous.bin application/octet-stream
          put microft8-source-continuous.tar.gz dist/microft8-source-continuous.tar.gz application/gzip
          put microft8-getting-started-continuous.pdf dist/microft8-getting-started-continuous.pdf application/pdf
          put manifest.json dist/manifest.json 'application/json; charset=utf-8'
